ыделите футажный слой, поставьте индикатор времени на начало перехода и запустите скрипт.","en":"(Once the include is fixed) select a footage layer, put the playhead where the transition should start and run the script."},"notes":{"ru":"В текущем виде не работает: подключается «../libs/index.jsx», которого нет (видимо, имелся в виду lib/index.jsx), и AE не запустит скрипт. Даже после исправления: смещение считается векторной арифметикой (val + dist), которой нет в ExtendScript, а на неквадратных слоях узор плиток покрывает квадратную область — часть слоя остаётся непокрытой, появляются пустые плитки. После исправления include в permissions нужно добавить то же, что у других скриптов с lib/index.jsx.","en":"Broken as shipped: it includes “../libs/index.jsx”, which doesn’t exist (lib/index.jsx was probably meant), so AE won’t run it. Even with the include fixed, the drift uses array math (val + dist) that ExtendScript doesn’t support, and on non-square layers the tile pattern covers a square area, leaving part of the layer uncovered and creating empty tiles. Once the include points to lib/index.jsx, permissions must get the same entries as the other lib/index.jsx scripts."},"tags":["masks","transition","tiles","animation"],"hostVersions":{"min":null,"tested":[],"minMajor":null},"author":{"name":"Mihail","github":"SqBrain"},"license":"MIT","ai":{"level":"unknown","model":null,"humanReviewed":true},"entry":"madeBunchOfMasks.js","added":"2026-06-01T16:26:23+03:00","updated":"2026-06-01T16:26:23+03:00","file":"dl/made-bunch-of-masks.jsx","size":5968,"sha256":"1a6072861737f86f5c6ad30198b95115ccb5921930cd34007fcba56ea5fe28e4","lines":136,"undoName":"Masks","inlined":[],"checks":{"status":"blocked","syntax":{"level":"es3","constExtension":false,"es3Error":null,"error":null},"capabilities":[],"warnings":[],"missingIncludes":[{"from":"madeBunchOfMasks.js","spec":"../libs/index.jsx"}]}},{"id":"make-matte","version":"1.0.0","host":"aftereffects","kind":"script","category":"mattes","title":{"ru":"Инвертированный матт из копии","en":"Choked Inverted Self-Matte"},"summary":{"ru":"Делает из копии слоя расширенный матт и вырезает им оригинал как трек-матт Alpha Inverted.","en":"Turns a copy of the layer into an expanded matte and cuts the original with it as an Alpha Inverted matte."},"description":{"ru":"Дублирует первый выделенный слой как «\u003cимя> Matte» (скрытый), оставляя все его эффекты и добавляя Simple Choker (Choke Matte −20, то есть матт расширяется). Затем с оригинала снимаются все эффекты, и копия назначается ему трек-маттом Alpha Inverted — оригинал виден только вне расширенного силуэта. Судя по логике, рассчитано на кеинг: копия с кеем вырезает объект, а оригинал без эффектов становится фоном с дыркой на месте объекта.","en":"Duplicates the first selected layer as “\u003cname> Matte” (hidden), keeping all its effects and adding Simple Choker (Choke Matte −20, which expands the matte). All effects are then removed from the original, and the copy becomes its Alpha Inverted track matte, so the original shows only outside the expanded silhouette. Judging by the logic it is meant for keying: the keyed copy cuts the subject out, and the effect-free original becomes a background plate with a hole where the subject was."},"usage":{"ru":"Выделите слой (например, футаж с эффектом кеинга) и запустите скрипт.","en":"Select the layer (e.g. footage with a keying effect) and run the script."},"notes":{"ru":"Снимает все эффекты с исходного слоя (они остаются только на копии-матте). Нужен AE 2023+ (setTrackMatte). Обращается к параметру «Choke Matte» по английскому имени — в локализованном AE может не сработать. Без выделенного слоя падает с ошибкой.","en":"Removes all effects from the original layer (they survive only on the matte copy). Needs AE 2023+ (setTrackMatte). It accesses “Choke Matte” by its English name, so it may fail in localized AE. With no layer selected it throws an error."},"tags":["matte","choker","track-matte","keying"],"hostVersions":{"min":"2023 (23.0)","tested":[],"minMajor":23},"author":{"name":"Mihail","github":"SqBrain"},"license":"MIT","ai":{"level":"unknown","model":null,"humanReviewed":true},"entry":"makeMatte.jsx","added":"2026-06-01T16:26:23+03:00","updated":"2026-06-01T16:26:23+03:00","file":"dl/make-matte.jsx","size":1037,"sha256":"416f60c35f74ae09868ab64788c2a45c8ff5ddf9032e9fa0e3c4210434f36b6f","lines":27,"undoName":"Make Matte","inlined":[],"checks":{"status":"ok","syntax":{"level":"es3","constExtension":false,"es3Error":null,"error":null},"capabilities":[],"warnings":[],"missingIncludes":[]}},{"id":"make-shadow","version":"1.0.0","host":"aftereffects","kind":"script","category":"layers","title":{"ru":"Размытая тень в Multiply","en":"Blurred Multiply Shadow"},"summary":{"ru":"Подкладывает под каждый выделенный слой размытую копию в Multiply — мягкую тень.","en":"Adds a blurred Multiply copy under each selected layer as a soft shadow."},"description":{"ru":"Для каждого выделенного слоя (кроме камер и света) создаёт под ним дубликат «\u003cимя> Shadow», снимает с него эффекты, добавляет Fast Box Blur (радиус 30), ставит режим Multiply и включает Preserve Underlying Transparency, чтобы тень затемняла только то, что под ней. Тень не смещается — подвиньте её сами.","en":"For each selected layer (cameras and lights are skipped) it creates a duplicate “\u003cname> Shadow” right below it, strips its effects, adds Fast Box Blur (radius 30), sets the Multiply blend mode and turns on Preserve Underlying Transparency, so the shadow only darkens what lies underneath. The shadow is not offset — move it yourself."},"usage":{"ru":"Выделите слои и запустите скрипт, затем сдвиньте новые слои Shadow.","en":"Select layers, run the script, then offset the new Shadow layers."},"notes":{"ru":"Эффект добавляется по английскому имени «Fast Box Blur» — в локализованном AE может не сработать.","en":"The blur is added by its English name “Fast Box Blur”, so it may fail in localized AE."},"tags":["shadow","blur","multiply","layers"],"hostVersions":{"min":null,"tested":[],"minMajor":null},"author":{"name":"Mihail","github":"SqBrain"},"license":"MIT","ai":{"level":"unknown","model":null,"humanReviewed":true},"entry":"makeShadow.jsx","added":"2026-06-01T16:26:23+03:00","updated":"2026-06-01T16:26:23+03:00","file":"dl/make-shadow.jsx","size":1567,"sha256":"813e052b4465f55f5ec396a1cbab5baf572d64e65b79e8041ace66005c46e12a","lines":41,"undoName":"Create Shadow","inlined":[],"checks":{"status":"ok","syntax":{"level":"es3","constExtension":false,"es3Error":null,"error":null},"capabilities":[],"warnings":[],"missingIncludes":[]}},{"id":"matte-layers","version":"1.0.0","host":"aftereffects","kind":"script","category":"mattes","title":{"ru":"Трек-матт от слоя выше","en":"Track Matte from Layer Above"},"summary":{"ru":"Назначает каждому выделенному слою трек-маттом слой над ним: альфа, люма или инвертированные.","en":"Sets the layer directly above as the track matte for each selected layer: alpha, luma or inverted."},"description":{"ru":"Для каждого выделенного слоя (кроме самого верхнего) вызывает setTrackMatte со слоем прямо над ним. Тип матта задаётся аргументом кнопки KBar: alpha, luma, alpha_inverted или luma_inverted; при обычном запуске — Alpha.","en":"For each selected layer (except the top one) it calls setTrackMatte with the layer right above it. The matte type comes from the KBar button argument: alpha, luma, alpha_inverted or luma_inverted; run on its own it uses Alpha."},"usage":{"ru":"Поставьте каждый матт прямо над слоем-заливкой, выделите слои-заливки и запустите скрипт (или кнопку KBar с нужным типом).","en":"Put each matte directly above its fill layer, select the fill layers and run the script (or a KBar button with the matte type)."},"notes":{"ru":"Нужен AE 2023+ (setTrackMatte и новая модель трек-маттов).","en":"Needs AE 2023+ (setTrackMatte and the new track matte model)."},"tags":["track-matte","alpha","luma","kbar"],"hostVersions":{"min":"2023 (23.0)","tested":[],"minMajor":23},"author":{"name":"Mihail","github":"SqBrain"},"license":"MIT","ai":{"level":"unknown","model":null,"humanReviewed":true},"entry":"matteLayers.jsx","added":"2026-06-01T16:26:23+03:00","updated":"2026-06-01T16:26:23+03:00","file":"dl/matte-layers.jsx","size":2045,"sha256":"20997823836c375da3a00a48f6f9fcbe69b62c2b346c442aee60aa3df1a355be","lines":64,"undoName":null,"inlined":[],"checks":{"status":"ok","syntax":{"level":"es3","constExtension":false,"es3Error":null,"error":null},"capabilities":[],"warnings":[],"missingIncludes":[]}},{"id":"plashka-creator","version":"1.0.0","host":"aftereffects","kind":"script","category":"masks-shapes","title":{"ru":"Плашка или матт под слой","en":"Plate or Matte for Layer"},"summary":{"ru":"Создаёт прямоугольную плашку или матт по размеру слоя со слайдерами ширины, высоты и выравнивания.","en":"Creates a rectangle plate or matte sized to each selected layer, with width, height and alignment controls."},"description":{"ru":"Для каждого выделенного слоя измеряет его границы в текущем кадре и строит шейп-слой с прямоугольником, которым управляют слайдеры Width/Height и выпадающие списки Vertical/Horizontal Anchor; родитель, 3D, поворот, масштаб и вход/выход копируются со слоя. По умолчанию — слой «MATTE» сверху: слой получает трек-матт Alpha и эффект Transform для анимации внутри матта. С Alt — плашка «PLASHKA» снизу с эффектом Fill. С Shift — и то и другое: матт привязан к плашке через parent, а его слайдеры повторяют слайдеры плашки.","en":"For each selected layer it measures the bounds at the current time and builds a shape layer with a rectangle driven by Width/Height sliders and Vertical/Horizontal Anchor dropdowns, copying the layer’s parent, 3D switch, rotation, scale and in/out points. Default: a “MATTE” layer above — the layer gets an Alpha track matte and a Transform effect for animating inside it. Alt: a “PLASHKA” plate below with a Fill effect. Shift: both, with the matte parented to the plate and its sliders following the plate’s."},"usage":{"ru":"Выделите текстовые или другие слои и запустите скрипт; с Alt — плашка под слоем, с Shift — плашка плюс матт.","en":"Select text or other layers and run the script; hold Alt for a plate under the layer, Shift for plate plus matte."},"notes":{"ru":"Вероятный баг: смещение позиции считается векторной арифметикой на массивах (center - anch, pos + offset) с переприсваиванием const — в ExtendScript так не работает, поэтому установка позиции, скорее всего, упадёт с ошибкой и плашка останется невыровненной. Перед публикацией нужно проверить в AE. Нужен AE 2020 (17.0.1)+ из-за Dropdown Menu Control.","en":"Likely bug: the position offset uses vector math on arrays (center - anch, pos + offset) and reassigns a const, which ExtendScript does not support, so setting the position will probably fail with an error and leave the plate unaligned. Test in AE before publishing. Needs AE 2020 (17.0.1)+ for the Dropdown Menu Control."},"tags":["plate","shape-layer","track-matte","text","rig"],"hostVersions":{"min":"2020 (17.0.1)","tested":[],"minMajor":17},"author":{"name":"Mihail","github":"SqBrain"},"license":"MIT","ai":{"level":"unknown","model":null,"humanReviewed":true},"entry":"Plashka creator.jsx","added":"2020-10-06T11:23:32+03:00","updated":"2026-06-01T16:26:23+03:00","file":"dl/plashka-creator.jsx","size":13347,"sha256":"ad9f49518cfde1d5fe75c9bf1aaa55be68c6c773714041503da72cb67ccd23ed","lines":313,"undoName":"Create Plashka","inlined":["lib/constants.jsx"],"checks":{"status":"ok","syntax":{"level":"es3","constExtension":true,"es3Error":null,"error":null},"capabilities":[],"warnings":[],"missingIncludes":[]}},{"id":"precomp","version":"1.0.0","host":"aftereffects","kind":"script","category":"comp","title":{"ru":"Прекомп по длине слоя","en":"Precompose Trimmed Layer"},"summary":{"ru":"Прекомпозит выделенный слой в композицию по его размеру и длине и кладёт её рядом с исходником.","en":"Precomposes the selected layer into a comp sized and trimmed to it, stored next to its source item."},"description":{"ru":"Берёт первый выделенный футажный слой или прекомп и создаёт новую композицию с шириной, высотой и pixel aspect слоя, fps исходника и длительностью, равной обрезанной длине слоя, в той же папке, где лежит исходник. Слой копируется внутрь, новая композиция встаёт на его место в то же время и в ту же позицию в стеке, исходный слой удаляется. Аргументы KBar «Camera» и «person» дают имя «Camera Tracking» или «person»; если имя слоя заканчивается на « 25 fps», к имени добавляется его начало.","en":"Takes the first selected footage or precomp layer and creates a new comp with the layer’s width, height and pixel aspect, the source’s frame rate and a duration equal to the layer’s trimmed length, inside the folder that holds the source. The layer is copied in, the new comp takes its place at the same time and stack position, and the original layer is deleted. The KBar arguments “Camera” and “person” name the comp “Camera Tracking” or “person”; if the layer name ends in “ 25 fps”, its prefix is added to the name."},"usage":{"ru":"Выделите футажный слой или прекомп в таймлайне и запустите скрипт — лучше кнопкой KBar с аргументом Camera или person.","en":"Select a footage or precomp layer in the timeline and run the script, ideally from a KBar button with the argument Camera or person."},"notes":{"ru":"Без KBar у новой композиции нет нормального имени (скорее всего, «undefined» или ошибка). Сдвиг времени внутри прекомпа берётся от верхнего слоя композиции, а не от выделенного, поэтому тайминг может съехать, если выделенный слой не первый. На стиллах и солидах (fps 0) может упасть.","en":"Run without KBar, the new comp gets no proper name (likely “undefined”, or an error). The time offset inside the precomp is taken from the comp’s top layer rather than the selected one, so timing can drift when the selected layer isn’t first. May fail on stills and solids (frame rate 0)."},"tags":["precompose","composition","trim","kbar"],"hostVersions":{"min":null,"tested":[],"minMajor":null},"author":{"name":"Mihail","github":"SqBrain"},"license":"MIT","ai":{"level":"unknown","model":null,"humanReviewed":true},"entry":"precomp.jsx","added":"2026-06-01T16:26:23+03:00","updated":"2026-06-01T16:26:23+03:00","file":"dl/precomp.jsx","size":2205,"sha256":"40416ed818a7d5f0d73d52573c546a9368e8efe9a23decd1106250d312fdde85","lines":59,"undoName":"Precomp","inlined":[],"checks":{"status":"ok","syntax":{"level":"es3","constExtension":false,"es3Error":null,"error":null},"capabilities":[],"warnings":[],"missingIncludes":[]}},{"id":"ps-rect-controller","version":"1.0.0","host":"aftereffects","kind":"preset","category":"masks-shapes","title":{"ru":"Псевдоэффект для прямоугольника","en":"Rectangle Controller Pseudo-Effect"},"summary":{"ru":"Пресет, который добавляет псевдоэффект PS_Rect_Controller с шириной, высотой, поворотом, смещением и скруглением.","en":"Preset that adds a PS_Rect_Controller pseudo effect with width, height, rotation, offset and roundness controls."},"description":{"ru":"Бинарный .ffx, который применяет один псевдоэффект PS_Rect_Controller с шестью анимируемыми параметрами: Width (по умолчанию 100), Height (50), Rotation (угол), X Offset, Y Offset и Roundness. Экспрешенов в пресете нет — он только даёт контролы, привязать их к прямоугольнику (например, к Size и Roundness у Rectangle Path) нужно самостоятельно.","en":"A binary .ffx that applies a single pseudo effect, PS_Rect_Controller, with six keyframeable controls: Width (default 100), Height (50), Rotation (angle), X Offset, Y Offset and Roundness. The preset holds no expressions — it only provides the controls, and you link them to a rectangle yourself (e.g. to the Size and Roundness of a Rectangle Path)."},"usage":{"ru":"Выделите слой (например, шейп-слой с прямоугольником) и примените пресет через Animation > Apply Animation Preset… или из панели Effects & Presets, предварительно скопировав файл в папку User Presets.","en":"Select a layer (e.g. a shape layer with a rectangle) and apply the preset via Animation > Apply Animation Preset…, or from the Effects & Presets panel after copying the file into your User Presets folder."},"notes":{"ru":"Судя по встроенным данным, сделан генератором псевдоэффектов; кроме самого эффекта в пресете ничего не сохранено.","en":"Judging by the embedded data it was made with a pseudo-effect generator; nothing but the effect itself is stored in the preset."},"tags":["pseudo-effect","preset","rectangle","controller","rig"],"hostVersions":{"min":null,"tested":[],"minMajor":null},"author":{"name":"Mihail","github":"SqBrain"},"license":"MIT","ai":{"level":"unknown","model":null,"humanReviewed":true},"entry":"true/PS_Rect_Controller.ffx","added":"2026-06-01T16:26:23+03:00","updated":"2026-06-01T16:26:23+03:00","file":"dl/ps-rect-controller.ffx","size":5350,"sha256":"e58805199347c181f5903b699cbe7799c086edc3c7178a87a250b87bd595a567","lines":null,"inlined":[],"checks":{"status":"ok","syntax":null,"capabilities":[],"warnings":[],"missingIncludes":[]}},{"id":"random-source","version":"1.0.0","host":"aftereffects","kind":"script","category":"layers","title":{"ru":"Случайная замена источника","en":"Randomize Precomp Sources"},"summary":{"ru":"Подменяет источник выделенных слоёв-прекомпов случайными композициями, выбранными в Project.","en":"Replaces the source of the selected precomp layers with random comps picked in the Project panel."},"description":{"ru":"Собирает композиции, выделенные в панели Project, и каждому выделенному слою активной композиции, источником которого служит композиция, подставляет случайную из этого списка (replaceSource без исправления экспрешенов). Слои, которые не являются прекомпами, пропускаются. Удобно для случайных вариаций в сетках и толпах.","en":"Collects the compositions selected in the Project panel, then gives every selected layer in the active comp whose source is a composition a random one from that list (replaceSource without fixing expressions). Layers that aren’t precomps are skipped. Handy for random variations in grids and crowds."},"usage":{"ru":"Выделите композиции-варианты в панели Project, затем щёлкните в таймлайн, выделите слои-прекомпы и запустите скрипт.","en":"Select the variant comps in the Project panel, then click into the timeline, select the precomp layers and run the script."},"notes":{"ru":"Если в Project не выделено ни одной композиции, скрипт падает с ошибкой. Одна и та же композиция может выпасть несколько раз подряд.","en":"If no comps are selected in the Project panel, the script throws an error. The same comp can be picked several times in a row."},"tags":["precomp","random","replace-source","variations"],"hostVersions":{"min":null,"tested":[],"minMajor":null},"author":{"name":"Mihail","github":"SqBrain"},"license":"MIT","ai":{"level":"unknown","model":null,"humanReviewed":true},"entry":"randomSource.jsx","added":"2026-06-01T16:26:23+03:00","updated":"2026-06-01T16:26:23+03:00","file":"dl/random-source.jsx","size":1101,"sha256":"a41ad084109cd0f2bb0a4f164a21dca610866f5ffbe83d516dea5b9d81b79bb9","lines":30,"undoName":"Random Source","inlined":[],"checks":{"status":"ok","syntax":{"level":"es3","constExtension":false,"es3Error":null,"error":null},"capabilities":[],"warnings":[],"missingIncludes":[]}},{"id":"rearrange-keys","version":"1.0.0","host":"aftereffects","kind":"script","category":"keyframes","title":{"ru":"Ровный шаг ключей","en":"Respace Keyframes Evenly"},"summary":{"ru":"Расставляет выделенные ключевые кадры с равным шагом в N кадров, сохраняя значения и изинг.","en":"Respaces the selected keyframes a fixed number of frames apart, keeping values and easing."},"description":{"ru":"Спрашивает число кадров между ключами (по умолчанию 2). Для каждого выделенного свойства с двумя и более выделенными ключами запоминает значение, интерполяцию, temporal ease и цветовую метку каждого ключа, удаляет их и создаёт заново от времени первого ключа с заданным шагом. Неравномерно расставленные ключи становятся равномерными.","en":"Asks for the number of frames between keys (default 2). For every selected property with two or more selected keyframes it records each key’s value, interpolation, temporal ease and color label, deletes the keys and recreates them from the first key’s time at the chosen step. Unevenly spaced keys become evenly spaced."},"usage":{"ru":"Выделите в таймлайне ключи, которые нужно расставить, запустите скрипт и введите шаг в кадрах.","en":"Select the keyframes to respace in the timeline, run the script and enter the step in frames."},"notes":{"ru":"Баг: признак пространственного свойства сравнивается, а не присваивается, поэтому на Position и подобных свойствах пространственные касательные не восстанавливаются (форма траектории может измениться). Cancel ломает выполнение. Нужен AE 2022 (22.6)+ из-за меток ключей. rearangeKeys.js в репозитории — старая копия, которая игнорирует введённый шаг.","en":"Bug: the spatial flag is compared instead of assigned, so on Position-like properties the spatial tangents are not restored (the motion path shape may change). Pressing Cancel breaks the run. Needs AE 2022 (22.6)+ for keyframe labels. rearangeKeys.js in the repo is an older copy that ignores the entered step."},"tags":["keyframes","timing","spacing","easing"],"hostVersions":{"min":"2022 (22.6)","tested":[],"minMajor":22},"author":{"name":"Mihail","github":"SqBrain"},"license":"MIT","ai":{"level":"unknown","model":null,"humanReviewed":true},"entry":"rearangeKeys.jsx","added":"2026-06-01T16:26:23+03:00","updated":"2026-06-01T16:26:23+03:00","file":"dl/rearrange-keys.jsx","size":3498,"sha256":"c2ba8fd4ed441ebc6bb79946943bfe932f0427a716eeea9d7ebe17dc94e58674","lines":74,"undoName":"rearange keys","inlined":[],"checks":{"status":"ok","syntax":{"level":"es3","constExtension":false,"es3Error":null,"error":null},"capabilities":[],"warnings":[],"missingIncludes":[]}},{"id":"rename-layers","version":"1.0.0","host":"aftereffects","kind":"script","category":"layers","title":{"ru":"Пакетное переименование слоёв","en":"Batch Rename Layers"},"summary":{"ru":"Переименовывает выделенные слои в одно имя с порядковыми номерами.","en":"Renames the selected layers to one base name with sequential numbers."},"description":{"ru":"Спрашивает имя и переименовывает выделенные слои в «Имя 1», «Имя 2»… в порядке выделения. Если нажать Cancel или оставить поле пустым, ничего не меняется.","en":"Asks for a name and renames the selected layers to “Name 1”, “Name 2”… in selection order. Cancelling or leaving the field empty changes nothing."},"usage":{"ru":"Выделите слои, запустите скрипт и введите базовое имя.","en":"Select layers, run the script and type the base name."},"notes":{"ru":"","en":""},"tags":["rename","layers","batch"],"hostVersions":{"min":null,"tested":[],"minMajor":null},"author":{"name":"Mihail","github":"SqBrain"},"license":"MIT","ai":{"level":"unknown","model":null,"humanReviewed":true},"entry":"rename_layers.jsx","added":"2026-06-01T16:26:23+03:00","updated":"2026-06-01T16:26:23+03:00","file":"dl/rename-layers.jsx","size":784,"sha256":"bb0b1118ecb85c7033accdbd47fce1def0918d22bbb2804681f4f0d7eab69729","lines":22,"undoName":"Rename Layers","inlined":[],"checks":{"status":"ok","syntax":{"level":"es3","constExtension":false,"es3Error":null,"error":null},"capabilities":[],"warnings":[],"missingIncludes":[]}},{"id":"round-path-points","version":"1.0.0","host":"aftereffects","kind":"script","category":"masks-shapes","title":{"ru":"Точки пути по полупикселям","en":"Snap Path Points to Half-Pixels"},"summary":{"ru":"Округляет вершины выделенных путей шейп-слоя до ближайших 0,5 px.","en":"Rounds the vertices of the selected shape-layer paths to the nearest 0.5 px."},"description":{"ru":"Для каждого выделенного свойства Path шейп-слоя без ключевых кадров привязывает все вершины к ближайшему целому или половинному пикселю; касательные не трогаются. Анимированные пути и маски пропускаются. Перед применением показывает отладочный алерт со списком атрибутов объекта Shape. Вторая функция, которая добавляла бы промежуточные точки на диагональных отрезках, в файле есть, но не вызывается.","en":"For each selected shape Path property without keyframes it snaps every vertex to the nearest whole or half pixel; tangents are left alone. Animated paths and masks are skipped. Before applying it shows a debug alert listing the Shape object’s attributes. A second function that would add intermediate points along diagonal segments is in the file but never called."},"usage":{"ru":"Выделите свойства Path внутри Contents шейп-слоя и запустите скрипт; закройте отладочный алерт, чтобы продолжить.","en":"Select Path properties inside a shape layer’s Contents and run the script; close the debug alert to continue."},"notes":{"ru":"Оставлен отладочный алерт на каждый путь. Нет undo-группы — каждый путь отменяется отдельно. Скрипт align-points делает то же самое и умеет ключевые кадры.","en":"A leftover debug alert pops up for every path. There is no undo group, so each path is a separate undo step. align-points does the same and also handles keyframes."},"tags":["paths","shape-layer","pixel-snapping","vertices"],"hostVersions":{"min":null,"tested":[],"minMajor":null},"author":{"name":"Mihail","github":"SqBrain"},"license":"MIT","ai":{"level":"unknown","model":null,"humanReviewed":true},"entry":"Round pathPoints.jsx","added":"2020-05-30T12:40:26+03:00","updated":"2020-05-30T12:40:26+03:00","file":"dl/round-path-points.jsx","size":5121,"sha256":"fac0e6a22b9e89bc6101b1001f63279e812a6c2501ef7da3e903fe54dfd86774","lines":127,"undoName":null,"inlined":[],"checks":{"status":"ok","syntax":{"level":"es3","constExtension":false,"es3Error":null,"error":null},"capabilities":[],"warnings":[],"missingIncludes":[]}},{"id":"rule-tangents","version":"1.0.0","host":"aftereffects","kind":"panel","category":"keyframes","title":{"ru":"Касательные по углу и длине","en":"Rule Tangents"},"summary":{"ru":"Панель для настройки пространственных касательных ключа через угол и длину.","en":"Panel for setting a keyframe’s spatial tangents by angle and length with sliders."},"description":{"ru":"Докируемая ScriptUI-панель (или плавающее окно) со слайдерами In Angle и Out Angle (0–360°), длины In/Out Tangent (0–2000) и двумя галочками, которые привязывают значения выхода к входу. Кнопка «Analyze Spatial» считывает касательные единственного выделенного ключа пространственного свойства (Position, Anchor Point и т. п.) в контролы; после этого движение слайдера или ввод числа переписывает касательные этого ключа. Работает с одним свойством и одним ключом за раз.","en":"A dockable ScriptUI panel (or floating window) with In Angle and Out Angle sliders (0–360°), In/Out Tangent length sliders (0–2000) and two checkboxes that lock the out values to the in values. “Analyze Spatial” reads the tangents of the single selected keyframe on a spatial property (Position, Anchor Point, etc.) into the controls; after that, moving a slider or typing a value rewrites that keyframe’s spatial tangents. Works on one property and one keyframe at a time."},"usage":{"ru":"Скопируйте файл в папку ScriptUI Panels и откройте из меню Window, чтобы задокать (или запустите через File > Scripts — будет плавающее окно). Выделите один ключ на Position, нажмите Analyze Spatial и двигайте слайдеры.","en":"Copy the file into the ScriptUI Panels folder and open it from the Window menu to dock it (or run it via File > Scripts for a floating window). Select one keyframe on Position, click Analyze Spatial, then move the sliders."},"notes":{"ru":"Возможные баги: углы переводятся в радианы переприсваиванием const-переменных, а const в ExtendScript не меняется, поэтому применённые углы, скорее всего, неверны; обработчики Out Angle проверяют блокировку длины вместо блокировки угла; если не выделено пространственное свойство, скрипт падает с ошибкой. Требует проверки. Права files, shell, settings и menu объявлены, потому что в сборку попадает вся lib/index.jsx; сам скрипт из библиотеки использует только prototypes. Скомпилированный «Rule tangets.jsxbin» не проверялся.","en":"Possible bugs: angles are converted to radians by reassigning const variables, which ExtendScript does not allow, so the applied angles are likely wrong; the Out Angle handlers check the length lock instead of the angle lock; with no spatial property selected it throws an error. Needs testing. files, shell, settings and menu are declared because the whole lib/index.jsx is inlined into the build; of the library, the script itself only relies on prototypes. The compiled “Rule tangets.jsxbin” was not reviewed."},"tags":["keyframes","tangents","motion-path","bezier","panel"],"hostVersions":{"min":null,"tested":[],"minMajor":null},"author":{"name":"Mihail","github":"SqBrain"},"license":"MIT","ai":{"level":"unknown","model":null,"humanReviewed":true},"entry":"Rule tangets.jsx","added":"2020-10-06T11:23:32+03:00","updated":"2020-10-06T11:23:32+03:00","file":"dl/rule-tangents.jsx","size":50220,"sha256":"a142de651b59657d375b12b8baba60114de204a8c4e91d6c4e391b0ae6c86471","lines":1445,"undoName":null,"inlined":["lib/index.jsx","lib/constants.jsx","lib/supportingFunctions.jsx","lib/appLevelFunctions.jsx","lib/compLevelFunctions.jsx","lib/propertyLevelFunctions.jsx","lib/alertFunctions.jsx","lib/fileDataFunctions.jsx","lib/checkFunctions.jsx","lib/prototypeLevelFunctions.jsx","lib/controllerFunctions.jsx","lib/moveAnchorPoint.jsx","lib/timeRefactor.jsx","lib/mathModule.jsx","lib/colorModule.jsx","lib/highOrderFunctions.jsx"],"checks":{"status":"review","syntax":{"level":"es3","constExtension":true,"es3Error":null,"error":null},"capabilities":[{"id":"shell","declared":true,"detected":true,"count":2,"samples":[{"line":754,"code":"system.callSystem( 'cmd /c start \"q\" \"' + url + '\"' );"},{"line":757,"code":"system.callSystem( cmd );"}]},{"id":"files","declared":true,"detected":true,"count":9,"samples":[{"line":692,"code":"var userDataFolder = Folder.userData;"},{"line":693,"code":"var motionScriptFolder = new Folder( userDataFolder.toString() + \"/\" + AUTHOR_NAME );"},{"line":697,"code":"alert( \"Error creating \" + SCRIPT_NAME + \" folder. The folder will be created in the\\n\" + Folder.temp.toString() + \"\\nfolder\" );"}]},{"id":"prototypes","declared":true,"detected":true,"count":11,"samples":[{"line":847,"code":"AVLayer.prototype.instance = \"Layer\";"},{"line":848,"code":"TextLayer.prototype.instance = \"Layer\";"},{"line":849,"code":"ShapeLayer.prototype.instance = \"Layer\";"}]},{"id":"settings","declared":true,"detected":true,"count":1,"samples":[{"line":340,"code":"app.settings.saveSetting( SCRIPT_NAMESafe, name, value );"}]},{"id":"menu","declared":true,"detected":true,"count":1,"samples":[{"line":677,"code":"app.executeCommand( 2359 );"}]}],"warnings":[{"code":"json","polyfilled":false,"count":2,"samples":[{"line":320,"code":"return JSON.parse( app.settings.getSetting( SCRIPT_NAMESafe, name ) );"},{"line":335,"code":"value = JSON.stringify( value );"}]}],"missingIncludes":[]}},{"id":"set-opacity","version":"1.0.0","host":"aftereffects","kind":"script","category":"layers","title":{"ru":"Переключатель прозрачности","en":"Toggle Reference Opacity"},"summary":{"ru":"Переключает Opacity выделенных слоёв между 100% и 40% (с Shift — 0%), чтобы быстро пригасить их.","en":"Toggles the selected layers between 100% and 40% opacity (0% with Shift) to quickly ghost them."},"description":{"ru":"Для каждого выделенного слоя без ключей Opacity: если прозрачность меньше 100%, возвращает 100%, иначе ставит 40%. С Shift вместо 40% ставится 0%, с Alt — всегда 100%. Слои с анимированной Opacity не трогаются.","en":"For each selected layer without Opacity keyframes: if opacity is below 100% it goes back to 100%, otherwise it is set to 40%. Holding Shift uses 0% instead of 40%; holding Alt always gives 100%. Layers with animated opacity are left alone."},"usage":{"ru":"Выделите слои и запустите скрипт (удобнее повесить его на горячую клавишу или кнопку KBar); для других значений держите при запуске Shift или Alt.","en":"Select layers and run the script (best bound to a hotkey or a KBar button); hold Shift or Alt while launching for the other values."},"notes":{"ru":"Нет undo-группы: изменение каждого слоя отменяется отдельно.","en":"No undo group: each layer’s change is a separate undo step."},"tags":["opacity","toggle","layers","workflow"],"hostVersions":{"min":null,"tested":[],"minMajor":null},"author":{"name":"Mihail","github":"SqBrain"},"license":"MIT","ai":{"level":"unknown","model":null,"humanReviewed":true},"entry":"Set Opacity.jsx","added":"2020-05-30T12:40:26+03:00","updated":"2020-05-30T12:40:26+03:00","file":"dl/set-opacity.jsx","size":1005,"sha256":"3ba3027877d7f37fe02ea0d7823542b5ec65e36419537c757cbad90e84aec8ad","lines":35,"undoName":null,"inlined":[],"checks":{"status":"ok","syntax":{"level":"es3","constExtension":false,"es3Error":null,"error":null},"capabilities":[],"warnings":[],"missingIncludes":[]}},{"id":"shift-channels","version":"1.0.0","host":"aftereffects","kind":"script","category":"color","title":{"ru":"RGB-сплит на три слоя","en":"RGB Split Layers"},"summary":{"ru":"Раскладывает слой на красную, зелёную и синюю копии через Shift Channels и складывает их в Screen.","en":"Splits a layer into red, green and blue copies with Shift Channels and recombines them in Screen mode."},"description":{"ru":"Добавляет первому выделенному слою эффект Shift Channels, оставляя только синий канал, затем делает две копии — только зелёный и только красный — в режиме Screen поверх. Картинка выглядит как исходная, пока вы не сдвинете или не отмасштабируете копии, — так получается хроматическая аберрация или RGB-сплит. Обрабатывается только первый выделенный слой.","en":"Adds a Shift Channels effect to the first selected layer so it keeps only the blue channel, then makes two copies on top — green only and red only — in Screen mode. The image looks unchanged until you offset or scale the copies, which gives a chromatic aberration / RGB split look. Only the first selected layer is processed."},"usage":{"ru":"Выделите слой (футаж, шейп или текст) и запустите скрипт, затем сдвиньте красную и зелёную копии.","en":"Select a layer (footage, shape or text), run the script, then nudge the red and green copies."},"notes":{"ru":"","en":""},"tags":["rgb-split","chromatic-aberration","channels","glitch"],"hostVersions":{"min":null,"tested":[],"minMajor":null},"author":{"name":"Mihail","github":"SqBrain"},"license":"MIT","ai":{"level":"unknown","model":null,"humanReviewed":true},"entry":"ShiftChannels.jsx","added":"2026-06-01T16:26:23+03:00","updated":"2026-06-01T16:26:23+03:00","file":"dl/shift-channels.jsx","size":1413,"sha256":"98e8797d3f10cb2a581fd4eeb2cd7e5f8a3b505e242d4a67f808ad561d9daa7c","lines":33,"undoName":"Shift Channels","inlined":[],"checks":{"status":"ok","syntax":{"level":"es3","constExtension":false,"es3Error":null,"error":null},"capabilities":[],"warnings":[],"missingIncludes":[]}},{"id":"show-hierarchy-of-property","version":"1.0.0","host":"aftereffects","kind":"script","category":"utility","title":{"ru":"Путь к свойству","en":"Show Property Path"},"summary":{"ru":"Для скриптеров: показывает цепочку групп выделенного свойства с именами, match name и индексами.","en":"Scripting tool: shows the group hierarchy of the selected property with names, match names and indices."},"description":{"ru":"Для первого выделенного свойства выводит все родительские группы от слоя до самого свойства: отображаемое имя, match name, индекс и соответствующую глубину propertyGroup(n). Помогает писать экспрешены и скрипты, которые обращаются к свойствам по match name. В проекте ничего не меняется.","en":"For the first selected property it lists every parent group from the layer down to the property itself, with display name, match name, property index and the matching propertyGroup(n) depth. Helps when writing expression t = [\"right\", \"bottom\"];\n        g.add(\"button\", undefined, S.askCancel, { name: \"cancel\" });\n        g.add(\"button\", undefined, S.askRun, { name: \"ok\" });\n        return d.show() === 1;\n    }\n\n    function doRun() {\n        var item = selected();\n        if (!item || !installed[item.id]) throw new Error(S.notInstalled);\n        var file = artifactFile(item);\n        if (!file.exists) throw new Error(S.notInstalled);\n        var sha = sha256(readFile(file, \"BINARY\"));\n        if (sha !== installed[item.id] || isRevoked(index, item.id, sha)) throw new Error(S.isRevoked);\n        if (item.kind === \"preset\") {\n            var layer = app.project.activeItem && app.project.activeItem.selectedLayers && app.project.activeItem.selectedLayers[0];\n            if (!layer) throw new Error(L(item.usage));\n            layer.applyPreset(file);\n            return;\n        }\n        var caps = detectedCaps(item), worrying = [];\n        for (var i = 0; i \u003c caps.length; i++) if (RISKY[caps[i]] || caps[i] === \"files\") worrying.push(caps[i]);\n        if (worrying.length && consent[item.id] !== sha) {\n            if (!ask(item, worrying)) return;\n            consent[item.id] = sha;\n            writeMap(\"consent\", consent);\n        }\n        $.evalFile(file);\n    }\n\n    function doRemove() {\n        var item = selected();\n        if (!item) return;\n        var file = artifactFile(item);\n        if (file.exists) file.remove();\n        delete installed[item.id];\n        delete consent[item.id];\n        writeMap(\"installed\", installed);\n        writeMap(\"consent\", consent);\n        fill();\n        statusLine.text = localize(S.doneRemove, L(item.title));\n    }\n\n    function doPage() {\n        var item = selected();\n        if (!item) return;\n        var url = (index.site || baseOf(getSetting(\"source\", DEFAULT_SOURCE))) + \"#\" + item.id;\n        if (!SAFE_URL.test(url.replace(\"#\", \"/\"))) throw new Error(S.badUrl)     var needsPref = caps.some(function (c) { return c.id === "files" || c.id === "shell" || c.id === "network"; });
    var ext = it.kind === "preset" ? ".ffx" : ".jsx";
    var notes = L(it.notes);
    var aiText = s.ai[(it.ai && it.ai.level) || "unknown"] + (it.ai && it.ai.model ? ", " + it.ai.model : "") + (it.ai && it.ai.humanReviewed && it.ai.level !== "none" && it.ai.level !== "unknown" ? ", " + s.reviewed : "");
    var steps = state.installTab === "panel" ? s.panelSteps : s.manualSteps(it);
    var hostText = "After Effects " + (it.hostVersions && it.hostVersions.minMajor ? minName(it) + "+" : s.slate.any);

    if (partial) {
      var side = document.getElementById("compat-slot");
      if (side) { side.innerHTML = compatPanel(it); wireVotes(app, it); }
      return;
    }

    app.innerHTML =
      '<div class="wrap">' +
        '<nav class="crumbs" aria-label="Breadcrumb"><a href="#catalog">' + esc(s.nav.catalog) + "</a><span>/</span><span>" + esc(s.cats[it.category]) + "</span></nav>" +
        '<div class="slate' + (it.checks.status === "ok" ? " done" : "") + '" id="slate">' +
          '<div class="sticks" aria-hidden="true"><div class="stick top"></div><div class="stick bottom"></div></div>' +
          '<div class="slate-body">' +
            '<div class="sf wide title"><span>' + esc(s.slate.script) + "</span><b>" + esc(L(it.title)) + "</b></div>" +
            '<div class="sf"><span>' + esc(s.slate.take) + "</span><b>" + esc(it.version) + "</b></div>" +
            '<div class="sf"><span>' + esc(s.slate.host) + "</span><b>" + esc(hostText) + "</b></div>" +
            '<div class="sf"><span>' + esc(s.slate.author) + "</span><b>" + esc(it.author.name) + "</b></div>" +
            '<div class="sf"><span>' + esc(s.slate.status) + "</span><b>" + esc(s.rq[it.checks.status]) + "</b></div>" +
            '<div class="sf wide hash"><span>' + esc(s.slate.sha) + "</span><b>" + strip(it.sha256) + "<span>" + esc(it.sha256) + "</span></b></div>" +
          "</div>" +
        "</div>" +
        '<p class="lead2">' + esc(L(it.summary)) + "</p>" +
        '<div class="actions">' +
          (blocked
            ? '<span class="btn" aria-disabled="true">' + esc(s.blockedBtn) + "</span>"
            : PREVIEW
              ? (SOURCES[id] ? '<button type="button" class="btn primary" data-clap="1" id="copy">' + esc(s.copy) + " <small>" + esc(it.id + ext) + ", " + fmtSize(it.size) + "</small></button>" : "")
              : '<a class="btn primary" data-clap="1" href="' + esc(it.file) + '" download="' + esc(it.id + ext) + '">' + esc(s.download) + " <small>" + esc(it.id + ext) + ", " + fmtSize(it.size) + "</small></a>") +
          (SOURCES[id] && (blocked || !PREVIEW) ? '<button type="button" class="btn" data-clap="1" id="copy">' + esc(s.copy) + "</button>" : "") +
          (PREVIEW && !blocked ? '<span class="fine">' + esc(s.previewNote) + "</span>" : "") +
        "</div>" +
        '<div class="layout">' +
          '<div class="prose">' +
            '<section><h2 class="h">' + esc(s.sections.what) + "</h2><p>" + esc(L(it.description)) + "</p></section>" +
            '<section><h2 class="h">' + esc(s.sections.how) + "</h2><p>" + esc(L(it.usage)) + "</p>" +
              (it.undoName ? '<p class="undo">' + esc(s.undoName()) + " <code>Undo " + esc(it.undoName) + "</code></p>" : "") +
            "</section>" +
            (notes ? '<section><h2 class="h">' + esc(s.sections.notes) + '</h2><p class="note">' + esc(notes) + "</p></section>" : "") +
            '<section><h2 class="h">' + esc(s.sections.install) + "</h2>" +
              '<div class="seg" role="tablist">' +
                '<button type="button" role="tab" data-tab="panel" aria-selected="' + (state.installTab === "panel") + '">' + esc(s.tabPanel) + "</button>" +
                '<button type="button" role="tab" data-tab="manual" aria-selected="' + (state.installTab === "manual") + '">' + esc(s.tabManual) + "</button>" +
              "</div>" +
              '<ol class="steps">' + steps.map(function (x) { return "<li>" + x + "</li>"; }).join("") + "</ol>" +
              (needsPref ? '<p class="note">' + s.prefNote + "</p>" : "") +
            "</section>" +
            (SOURCES[id] ? '<section><h2 class="h">' + esc(s.sections.source) + '</h2><details class="src"><summary>' + esc(s.showSource(it.lines)) + '</summary><div class="code" id="code"></div></details></section>' : "") +
          "</div>" +
          '<aside class="side">' +
            checksPanel(it) +
            '<div id="compat-slot">' + compatPanel(it) + "</div>" +
            '<section class="pnl"><header>' + esc(s.file) + '</header><dl class="facts">' +
              "<dt>" + esc(s.facts.kind) + "</dt><dd>" + esc(s.kind[it.kind]) + "</dd>" +
              "<dt>" + esc(s.facts.license) + "</dt><dd>" + esc(it.license) + "</dd>" +
              "<dt>" + esc(s.facts.ai) + "</dt><dd>" + esc(aiText) + "</dd>" +
              "<dt>" + esc(s.slate.date) + "</dt><dd>" + esc(fmtDate(it.added)) + "</dd>" +
              "<dt>" + esc(s.facts.entry) + '</dt><dd><a href="' + esc(INDEX.repo) + "/blob/main/" + encodeURI(it.entry) + '" target="_blank" rel="noopener">' + esc(it.entry) + "</a></dd>" +
              "<dt>" + esc(s.facts.size) + "</dt><dd>" + fmtSize(it.size) + (it.lines ? ", " + it.lines + " " + esc(s.facts.lines) : "") + "</dd>" +
              "<dt>" + esc(s.facts.sha) + '</dt><dd class="hash">' + esc(it.sha256) + "</dd>" +
            "</dl></section>" +
          "</aside>" +
        "</div>" +
      "</div>";

    app.querySelector(".seg").addEventListener("click", function (e) {
      var b = e.target.closest("[data-tab]");
      if (!b) return;
      state.installTab = b.getAttribute("data-tab");
      var y = window.scrollY;
      renderScript(app, id);
      window.scrollTo(0, y);
    });
    var details = app.querySelector("details.src");
    if (details) details.addEventListener("toggle", function () {
      var box = document.getElementById("code");
      if (details.open && !box.firstChild) box.innerHTML = sourceView(it);
    });
    // The clapper closes when you take the script.
    Array.prototype.forEach.call(app.querySelectorAll("[data-clap]"), function (b) {
      b.addEventListener("click", function () {
        var slate = document.getElementById("slate");
        slate.classList.add("clap");
        setTimeout(function () { slate.classList.remove("clap"); }, 240);
      });
    });
    var copy = document.getElementById("copy");
    if (copy) copy.addEventListener("click", function () {
      var fail = function () {
        if (details) { details.open = true; var box = document.getElementById("code"); if (!box.firstChild) box.innerHTML = sourceView(it); }
        toast(s.copyFail);
      };
      try { navigator.clipboard.writeText(SOURCES[id]).then(function () { toast(s.copied); }, fail); } catch (e) { fail(); }
    });
    wireVotes(app, it);
  }

  function wireVotes(app, it) {
    var s = t();
    var sel = document.getElementById("ver");
    if (sel) sel.addEventListener("change", function () { setVer(+sel.value); });
    var rowEl = app.querySelector(".vote-row");
    if (!rowEl) return;
    rowEl.addEventListener("click", function (e) {
      var b = e.target.closest("[data-vote]");
      if (!b || b.disabled) return;
      var major = VERSIONS[state.ver].major;
      var votes = state.votes[it.id] || {};
      var isNew = !votes[major];
      votes[major] = b.getAttribute("data-vote");
      state.votes[it.id] = votes;
      save("votes2", state.votes);
      renderChrome("script");
      renderScript(app, it.id, true);
      toast(isNew ? s.voted : s.revoted);
    });
  }

  // ---------------------------------------------------------- requests
  function renderRequests(app) {
    var s = t();
    var mine = state.requests.map(function (r) { return { id: r.id, title: r.title, text: r.text, plus: 0, status: "open", mine: true }; });
    var all = mine.slice().reverse().concat(s.examples);
    app.innerHTML =
      '<div class="wrap page">' +
        "<header><h1>" + esc(s.reqTitle) + "</h1><p>" + esc(s.reqLead) + "</p></header>" +
        '<div class="cols">' +
          '<div class="queue" id="queue">' +
            '<div class="q-head"><span>' + esc(s.qHead.num) + "</span><span>" + esc(s.qHead.req) + "</span><span>" + esc(s.qHead.status) + "</span><span>" + esc(s.qHead.votes) + "</span><span></span></div>" +
            all.map(function (r, i) {
              var st = state.takes[r.id] ? "taken" : r.status;
              var cls = st === "done" ? "ok" : st === "taken" ? "review" : "needs";
              var plus = r.plus + (state.plus[r.id] ? 1 : 0);
              return '<div class="q-row">' +
                '<span class="idx">' + (i + 1) + "</span>" +
                '<span class="rqt"><b>' + esc(r.title) + "</b>" + (r.text ? "<span>" + esc(r.text) + "</span>" : "") + '<small class="tag">' + esc(r.mine ? s.yours : s.example) + "</small></span>" +
                '<span class="rq ' + cls + '">' + esc(s.qStatus[st]) + "</span>" +
                '<span class="votes">' + plus + "</span>" +
                '<span class="acts"><button type="button" class="mini-btn" data-plus="' + esc(r.id) + '" aria-pressed="' + !!state.plus[r.id] + '">' + esc(s.plusOne) + '</button> <button type="button" class="mini-btn" data-take="' + esc(r.id) + '" aria-pressed="' + !!state.takes[r.id] + '">' + esc(state.takes[r.id] ? s.taken : s.take) + "</button></span>" +
              "</div>";
            }).join("") +
          "</div>" +
          '<form class="add" id="req-form" novalidate>' +
            '<h2 class="h">' + esc(s.reqForm) + "</h2>" +
            '<label for="req-title">' + esc(s.reqName) + '<input type="text" id="req-title" maxlength="140" placeholder="' + esc(s.reqNamePh) + '"></label>' +
            '<label for="req-text">' + esc(s.reqDesc) + '<textarea id="req-text" maxlength="800" placeholder="' + esc(s.reqDescPh) + '"></textarea></label>' +
            '<label for="req-host">' + esc(s.reqHost) + '<select id="req-host"><option>After Effects</option><option disabled>Blender (' + esc(s.soon) + ")</option><option disabled>Houdini (" + esc(s.soon) + ")</option><option disabled>Nuke (" + esc(s.soon) + ")</option></select></label>" +
            '<button type="submit" class="btn primary">' + esc(s.reqSubmit) + "</button>" +
            '<p class="fine">' + esc(s.localOnly) + "</p>" +
          "</form>" +
        "</div>" +
      "</div>";
    document.getElementById("queue").addEventListener("click", function (e) {
      var p = e.target.closest("[data-plus]"), tk = e.target.closest("[data-take]");
      if (p) { var a = p.getAttribute("data-plus"); state.plus[a] = !state.plus[a]; save("plus", state.plus); }
      else if (tk) { var b = tk.getAttribute("data-take"); state.takes[b] = !state.takes[b]; save("takes", state.takes); }
      else return;
      renderRequests(app);
    });
    document.getElementById("req-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var title = document.getElementById("req-title").value.trim();
      var text = document.getElementById("req-text").value.trim();
      if (!title) { toast(s.reqEmptyName); document.getElementById("req-title").focus(); return; }
      state.requests.push({ id: "my" + Date.now(), title: title, text: text });
      save("requests", state.requests);
      renderRequests(app);
      toast(s.reqAdded);
    });
  }

  // ------------------------------------------------------------ submit
  var SAMPLE = {
    id: "layer-grid", version: "1.0.0", entry: "scripts/layer-grid.jsx", host: "aftereffects", kind: "script", category: "layers",
    title: { en: "Layers to grid", ru: "Слои по сетке" },
    summary: { en: "Lays selected layers out on a grid with spacing.", ru: "Раскладывает выделенные слои по сетке с отступом." },
    description: { en: "…", ru: "…" },
    usage: { en: "Select layers and run the script.", ru: "Выделите слои и запустите скрипт." },
    tags: ["layout", "grid", "position"],
    hostVersions: { min: "2019 (16.0)", tested: ["AE 2025"] },
    author: { name: "Your Name", github: "your-login" },
    license: "MIT",
    ai: { level: "assisted", model: "Claude", humanReviewed: true },
    permissions: [], requires: [], notes: { en: "", ru: "" }
  };
  function renderSubmit(app) {
    var s = t();
    app.innerHTML =
      '<div class="wrap page">' +
        "<header><h1>" + esc(s.submitTitle) + "</h1><p>" + esc(s.submitLead) + "</p></header>" +
        '<div class="cols even">' +
          '<div class="prose">' +
            '<ol class="steps">' + s.submitSteps.map(function (x) { return "<li>" + x + "</li>"; }).join("") + "</ol>" +
            '<section class="card"><h2 class="h">' + esc(s.autoTitle) + '</h2><ul class="plain">' + s.autoList.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul></section>" +
            '<section class="card"><h2 class="h">' + esc(s.aiTitle) + "</h2><p>" + esc(s.aiText) + "</p></section>" +
            '<p class="note">' + esc(s.noPoints) + ' <a href="#keepers">' + esc(s.nav.keepers) + "</a></p>" +
          "</div>" +
          '<section class="prose"><h2 class="h">' + esc(s.manifestTitle) + ': <code class="path">catalog/layer-grid.json</code></h2><pre class="manifest">' + esc(JSON.stringify(SAMPLE, null, 2)) + "</pre></section>" +
        "</div>" +
      "</div>";
  }

  // ----------------------------------------------------------- keepers
  function renderKeepers(app) {
    var s = t(), xp = xpTotal(), r = rankFor(xp), ranks = s.ranks, next = ranks[r + 1];
    var pct = next ? Math.round(((xp - ranks[r][1]) / (next[1] - ranks[r][1])) * 100) : 100;
    app.innerHTML =
      '<div class="wrap page">' +
        "<header><h1>" + esc(s.keepersTitle) + "</h1><p>" + esc(s.keepersLead) + "</p></header>" +
        '<div class="progress">' +
          '<div class="top"><span>' + esc(s.yourXp) + ": <b>" + xp + " XP</b>, " + esc(ranks[r][0]) + "</span><span>" + esc(next ? s.toNext(next[1] - xp, next[0]) : s.top) + "</span></div>" +
          '<div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><i style="width:' + pct + '%"></i></div>' +
          '<p class="fine">' + esc(s.localOnly) + "</p>" +
        "</div>" +
        '<div class="ladder">' + ranks.map(function (x, i) {
          return '<div class="rung' + (i === r ? " now" : "") + '"><b>' + esc(x[0]) + "</b><span>" + x[1] + "+ XP</span></div>";
        }).join("") + "</div>" +
        '<div class="cols">' +
          '<section class="prose"><h2 class="h">' + esc(s.rulesTitle) + '</h2><div style="overflow-x:auto"><table class="rules"><thead><tr><th>' + esc(s.rulesHead[0]) + '</th><th style="text-align:right">' + esc(s.rulesHead[1]) + "</th></tr></thead><tbody>" +
            s.rules.map(function (x) {
              return '<tr class="' + (x[1] === 0 ? "zero" : "") + '"><td>' + esc(x[0]) + (x[2] ? '<span class="live">' + esc(s.live) + "</span>" : "") + '</td><td class="num">' + (x[1] ? "+" + x[1] : "0") + "</td></tr>";
            }).join("") +
          '</tbody></table></div><p class="note">' + esc(s.zero) + "</p></section>" +
          '<section class="card"><h2 class="h">' + esc(s.marksTitle) + '</h2><dl class="defs">' + s.marks.map(function (b) { return "<dt>" + esc(b[0]) + "</dt><dd>" + esc(b[1]) + "</dd>"; }).join("") + "</dl></section>" +
        "</div>" +
      "</div>";
  }

  // ------------------------------------------------------------- about
  function renderAbout(app) {
    var s = t();
    var hosts = [
      { name: "After Effects", versions: VERSIONS.map(function (v) { return String(v.major); }), open: true },
      { name: "Blender", versions: ["3.6", "4.0", "4.1", "4.2", "4.3", "4.4", "4.5", "5.0", "5.1"] },
      { name: "Houdini", versions: ["19.0", "19.5", "20.0", "20.5", "21.0"] },
      { name: "Nuke", versions: ["13", "14", "15", "16", "17"] },
      { name: "DaVinci Resolve", versions: ["17", "18", "19", "20", "21"] }
    ];
    app.innerHTML =
      '<div class="wrap page">' +
        "<header><h1>" + esc(s.aboutTitle) + "</h1><p>" + esc(s.aboutLead) + "</p></header>" +
        '<div class="cols even">' +
          '<div class="prose">' + s.aboutText.map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("") +
            '<section class="card"><h2 class="h">' + esc(s.rulesHouse) + '</h2><ul class="plain">' + s.house.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul></section>" +
          "</div>" +
          '<section class="card"><h2 class="h">' + esc(s.hostsTitle) + '</h2><p class="fine">' + esc(s.hostsLead) + '</p><div class="hosts">' +
            hosts.map(function (h, k) {
              return '<div class="host-row' + (h.open ? "" : " soon") + '"><span>' + esc(h.name) + (h.open ? "" : " (" + esc(s.soon) + ")") + '</span><div class="mini" style="--n:' + h.versions.length + ";--lc:" + ["var(--l-blue)", "var(--l-orange)", "var(--l-red)", "var(--l-yellow)", "var(--l-cyan)"][k] + '">' +
                h.versions.map(function (v) { return '<div><i class="' + (h.open ? "works" : "untested") + '"></i><span>' + esc(v) + "</span></div>"; }).join("") + "</div></div>";
            }).join("") +
          "</div></section>" +
        "</div>" +
      "</div>";
  }

  // ------------------------------------------------------------ router
  var lastView = null;
  function render() {
    var r = route(), app = document.getElementById("app");
    renderChrome(r.view);
    if (r.view === "script") renderScript(app, r.id);
    else if (r.view === "requests") renderRequests(app);
    else if (r.view === "submit") renderSubmit(app);
    else if (r.view === "keepers") renderKeepers(app);
    else if (r.view === "about") renderAbout(app);
    else renderCatalog(app, false);
    var key = r.view + (r.id || "");
    if (key !== lastView) { window.scrollTo(0, 0); lastView = key; }
    document.title = r.view === "script" ? L(BY_ID[r.id].title) + " · VFX Cave" : "VFX Cave";
  }

  document.querySelector(".lang").addEventListener("click", function (e) {
    var b = e.target.closest("[data-lang]");
    if (!b) return;
    state.lang = b.getAttribute("data-lang");
    save("lang", state.lang);
    var y = window.scrollY;
    lastView = route().view + (route().id || "");
    render();
    window.scrollTo(0, y);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "/" || /^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName || ""))) return;
    var q = document.getElementById("q");
    if (q) { e.preventDefault(); q.focus(); }
  });
  window.addEventListener("hashchange", render);
  render();
})();
</script>

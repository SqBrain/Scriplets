<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>VFX Cave</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Free After Effects scripts written by artists, by hand or with AI. Every file is parsed for ExtendScript, scanned for risky calls and hashed before it's listed.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Sofia+Sans+Extra+Condensed:wght@500;700;800&display=swap">
<style>
/* Layout: the catalog is a composition. A panel-tab strip on top, a short
   statement and search, then the timeline: layer rows (label, name, capability
   switches) on the left and a ruler of After Effects versions on the right with
   a draggable playhead. Script pages open with a slate. One dark world built
   from AE's panel greys, coloured only by the 16 AE label colours. */
:root {
  --well: #181818;      /* page, panel well */
  --panel: #222222;     /* panels, timeline body */
  --row: #2a2a2a;       /* layer rows */
  --row-hi: #383838;    /* hovered / selected layer */
  --hair: #3a3a3a;      /* row separators, panel edges */
  --ink: #e4e4e4;       /* primary text */
  --ink-2: #a6a6a6;     /* secondary text */
  --ink-3: #747474;     /* tertiary text, unlit switches */
  --cti: #2d8ceb;       /* current-time indicator: the playhead */
  --cti-ink: #67adf3;   /* playhead blue for text on dark */
  --done: #4aa44c;      /* render queue: Done (label Green) */
  --queued: #e4d84c;    /* render queue: Queued (label Yellow) */
  --err: #e35d5d;       /* render queue: Err Stopped (label Red, lifted for text) */
  --err-fill: #b53838;
  --chalk: #ece8dc;     /* slate chalk */
  --slate: #121212;     /* slate board */
  /* After Effects default label colours, 1–16 */
  --l-red: #b53838; --l-yellow: #e4d84c; --l-aqua: #a9cbc7; --l-pink: #e5bcc9;
  --l-lavender: #a9a9ca; --l-peach: #e7c19e; --l-seafoam: #b3c7b3; --l-blue: #677de0;
  --l-green: #4aa44c; --l-purple: #8e2c9a; --l-orange: #e8920d; --l-brown: #7f452a;
  --l-fuchsia: #f46dd6; --l-cyan: #3da2a5; --l-sandstone: #a89677; --l-darkgreen: #1e401e;
  --f-ui: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --f-slate: "Sofia Sans Extra Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --t-xs: 0.75rem; --t-s: 0.8125rem; --t-m: 0.9375rem; --t-l: 1.125rem; --t-xl: 1.625rem; --t-xxl: 2.75rem;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--well); }
body { margin: 0; background: var(--well); color: var(--ink); font: 400 var(--t-m)/1.55 var(--f-ui); min-height: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
a { color: var(--cti-ink); text-underline-offset: 3px; }
a:hover { color: var(--ink); }
:focus-visible { outline: 2px solid var(--cti); outline-offset: 2px; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
code, pre { font-family: var(--f-mono); }
.wrap {
  max-width: 1200px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------------- panel-tab strip ---------------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--panel); border-bottom: 1px solid #111; }
.bar-in { display: flex; align-items: stretch; gap: 22px; min-height: 48px; }
.mark { display: flex; align-items: center; gap: 9px; color: var(--ink); text-decoration: none; font-weight: 700; letter-spacing: -0.01em; font-size: 1.0625rem; }
.mark:hover { color: var(--ink); }
.ease { /* the Easy Ease keyframe glyph */
  width: 11px; height: 14px; background: var(--ink); flex: none;
  clip-path: polygon(0 0, 100% 0, 58% 50%, 100% 100%, 0 100%, 42% 50%);
}
.mark:hover .ease { background: var(--cti); }
.tabs { display: flex; align-items: stretch; margin-right: auto; overflow-x: auto; scrollbar-width: none; }
.tabs a {
  display: flex; align-items: center; padding: 0 13px; color: var(--ink-2); text-decoration: none; font-size: var(--t-s);
  border-left: 1px solid transparent; border-right: 1px solid transparent; white-space: nowrap;
}
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { color: var(--ink); background: var(--well); border-color: #111; box-shadow: inset 0 2px 0 var(--cti); }
.bar-side { display: flex; align-items: center; gap: 12px; }
.xp { color: var(--ink-2); text-decoration: none; font-size: var(--t-s); white-space: nowrap; }
.xp b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.lang { display: flex; border: 1px solid var(--hair); border-radius: 3px; overflow: hidden; }
.lang button { background: none; border: 0; padding: 4px 8px; cursor: pointer; color: var(--ink-3); font-size: var(--t-xs); font-weight: 600; }
.lang button[aria-pressed="true"] { background: var(--hair); color: var(--ink); }

/* ---------------- hero ---------------- */
.hero { padding-block: 46px 26px; display: grid; gap: 18px; }
.hero h1 { font-size: var(--t-xxl); line-height: 1.04; font-weight: 700; letter-spacing: -0.035em; max-width: 19ch; }
.hero p { color: var(--ink-2); font-size: var(--t-l); max-width: 60ch; line-height: 1.5; }
.find { display: flex; align-items: center; gap: 10px; max-width: 560px; background: var(--panel); border: 1px solid var(--hair); border-radius: 4px; padding: 0 12px; }
.find:focus-within { border-color: var(--cti); }
.find svg { flex: none; color: var(--ink-3); }
.find input { flex: 1; min-width: 0; background: none; border: 0; outline: none; padding: 11px 0; font-size: var(--t-m); }
.find input::placeholder { color: var(--ink-3); }
.find kbd { font: 500 var(--t-xs)/1 var(--f-mono); color: var(--ink-3); border: 1px solid var(--hair); border-radius: 3px; padding: 3px 6px; }

/* ---------------- composition (timeline) ---------------- */
.comp { background: var(--panel); border: 1px solid #111; border-radius: 4px; margin-bottom: 56px; }
.comp-head { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "ctd opts" "labels labels"; gap: 14px 26px; align-items: end; padding: 14px 16px; border-bottom: 1px solid #111; }
.comp-head .ctd { grid-area: ctd; }
.comp-head .opts { grid-area: opts; justify-content: flex-end; }
.comp-head .labels { grid-area: labels; }
.ctd { display: grid; gap: 2px; }
.ctd span { font-size: var(--t-xs); color: var(--ink-3); }
.ctd output { font: 500 1.5rem/1 var(--f-mono); color: var(--cti-ink); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.ctd small { font-size: var(--t-xs); color: var(--ink-2); }
.labels { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
.lbl {
  display: inline-flex; align-items: center; gap: 7px; padding: 4px 8px 4px 6px; border-radius: 3px; cursor: pointer;
  background: transparent; border: 1px solid transparent; color: var(--ink-2); font-size: var(--t-s); line-height: 1.2;
}
.lbl:hover { background: var(--row); color: var(--ink); }
.lbl i { width: 11px; height: 11px; border-radius: 2px; background: var(--lc, var(--ink-3)); flex: none; }
.lbl small { color: var(--ink-3); font-variant-numeric: tabular-nums; }
.lbl[aria-pressed="true"] { background: var(--row-hi); border-color: #4a4a4a; color: var(--ink); }
.opts { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.opts label { display: inline-flex; gap: 7px; align-items: center; font-size: var(--t-s); color: var(--ink-3); }
select, input[type="text"], textarea {
  background: var(--well); border: 1px solid var(--hair); border-radius: 3px; padding: 5px 8px; font-size: var(--t-s);
}
select:focus, input[type="text"]:focus, textarea:focus { border-color: var(--cti); outline: none; }

.tl { --cols: 2.6rem 4px minmax(0, 1fr) 8.4rem minmax(15rem, 34%) 7.4rem; position: relative; }
.tl-head, .row { display: grid; grid-template-columns: var(--cols); align-items: center; }
.tl-head { height: 40px; border-bottom: 1px solid #111; font-size: var(--t-xs); color: var(--ink-3); background: var(--panel); position: sticky; top: calc(env(safe-area-inset-top, 0px) + 48px); z-index: 3; }
.tl-head > span { padding: 0 8px; }
.sw-head, .sw { display: grid; grid-template-columns: repeat(5, 1fr); justify-items: center; align-items: center; height: 100%; border-left: 1px solid #1a1a1a; border-right: 1px solid #1a1a1a; }
.sw-head svg { color: var(--ink-3); }
.ruler { position: relative; height: 100%; cursor: ew-resize; touch-action: none; user-select: none; }
.ticks { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(var(--n), 1fr); }
.ticks button {
  all: unset; cursor: pointer; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 3px;
  padding-bottom: 5px; font: 400 0.6875rem/1 var(--f-mono); color: var(--ink-3); position: relative;
}
.ticks button::after { content: ""; width: 1px; height: 6px; background: #555; }
.ticks button[aria-current="true"] { color: var(--cti-ink); }
.ticks button:focus-visible { outline: 2px solid var(--cti); }
.cti-head { /* the playhead handle */
  position: absolute; top: 3px; width: 13px; height: 13px; margin-left: -6px; background: var(--cti);
  clip-path: polygon(0 0, 100% 0, 100% 55%, 50% 100%, 0 55%); pointer-events: none;
}
.rows { margin: 0; padding: 0; }
.row {
  min-height: 52px; color: var(--ink); text-decoration: none; background: var(--row); border-bottom: 1px solid #1c1c1c;
  position: relative;
}
.row:hover, .row:focus-visible { background: var(--row-hi); color: var(--ink); }
.row:focus-visible { outline-offset: -2px; }
.row.out { opacity: 0.42; }
.row .idx { font: 400 var(--t-xs)/1 var(--f-mono); color: var(--ink-3); text-align: right; padding-right: 10px; font-variant-numeric: tabular-nums; }
.row .lc { align-self: stretch; background: var(--lc); }
.row .nm { padding: 8px 12px; min-width: 0; display: grid; gap: 1px; }
.row .nm b { font-weight: 500; font-size: var(--t-m); line-height: 1.3; }
.row .nm span { color: var(--ink-2); font-size: var(--t-s); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sw span { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 3px; color: #4b4b4b; position: relative; }
.sw span.on { color: var(--ink-2); background: #1f1f1f; }
.sw span.risk { color: var(--err); }
.sw span.undeclared::after { content: ""; position: absolute; top: 2px; right: 2px; width: 5px; height: 5px; border-radius: 50%; background: var(--queued); }
.trk { position: relative; align-self: stretch; display: grid; grid-template-columns: repeat(var(--n), 1fr); align-items: center; padding: 0; }
.trk i { height: 16px; display: block; }
.trk i.works { background: var(--lc); }
.trk i.untested {
  background:
    repeating-conic-gradient(color-mix(in srgb, var(--lc) 62%, #2a2a2a) 0 25%, color-mix(in srgb, var(--lc) 26%, #2a2a2a) 0 50%) 0 0 / 8px 8px;
}
.trk i.broken { background: repeating-linear-gradient(135deg, var(--err-fill) 0 4px, #4d1717 4px 8px); }
.trk i.first { position: relative; border-radius: 2px 0 0 2px; }
.trk i.first::before { /* release keyframe */
  content: ""; position: absolute; left: -4px; top: 50%; width: 8px; height: 8px; background: var(--ink); transform: translateY(-50%) rotate(45deg);
}
.trk i.last { border-radius: 0 2px 2px 0; }
.cti-line { position: absolute; top: 0; bottom: -1px; width: 1px; background: var(--cti); pointer-events: none; z-index: 1; }
.rq { padding: 0 12px; font-size: var(--t-s); display: flex; align-items: center; gap: 7px; white-space: nowrap; }
.rq::before { content: ""; width: 8px; height: 8px; border-radius: 1px; background: currentColor; flex: none; }
.rq.ok { color: var(--done); }
.rq.review { color: var(--queued); }
.rq.blocked { color: var(--err); }
.rq.needs { color: var(--ink-2); }
.rq.needs::before { background: transparent; border: 1px solid currentColor; }
.empty { padding: 34px 16px; color: var(--ink-2); text-align: center; background: var(--row); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 22px; padding: 12px 16px; border-top: 1px solid #111; font-size: var(--t-xs); color: var(--ink-3); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { width: 22px; height: 10px; display: inline-block; --lc: var(--l-aqua); border-radius: 2px; }
.legend i.works { background: var(--lc); }
.legend i.untested { background: repeating-conic-gradient(color-mix(in srgb, var(--lc) 62%, #2a2a2a) 0 25%, color-mix(in srgb, var(--lc) 26%, #2a2a2a) 0 50%) 0 0 / 6px 6px; }
.legend i.broken { background: repeating-linear-gradient(135deg, var(--err-fill) 0 3px, #4d1717 3px 6px); }
.legend b { font-weight: 500; }
.legend .ok { color: var(--done); } .legend .review { color: var(--queued); } .legend .blocked { color: var(--err); }
.opts .ver-pick { display: none; }

/* ---------------- script page ---------------- */
.crumbs { padding-block: 22px 14px; font-size: var(--t-s); color: var(--ink-3); display: flex; gap: 8px; flex-wrap: wrap; }
.crumbs a { color: var(--ink-2); text-decoration: none; }
.crumbs a:hover { color: var(--ink); }
.slate { background: var(--slate); color: var(--chalk); border-radius: 4px; overflow: hidden; border: 1px solid #000; }
.sticks { position: relative; height: 38px; background: #0b0b0b; }
.stick {
  position: absolute; left: 0; right: 0; height: 19px;
  background: repeating-linear-gradient(-55deg, var(--chalk) 0 22px, #141414 22px 44px);
}
.stick.bottom { bottom: 0; }
.stick.top { top: 0; transform-origin: 6px 100%; transform: rotate(-4deg); transition: transform 0.12s ease-in; }
.slate.done .stick { background: repeating-linear-gradient(-55deg, #bfbfbf 0 22px, #bfbf00 22px 44px, #00bfbf 44px 66px, #00bf00 66px 88px, #bf00bf 88px 110px, #bf0000 110px 132px, #0000bf 132px 154px); }
.slate.clap .stick.top { transform: rotate(0deg); }
.slate-body { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.sf { padding: 10px 14px 12px; border-right: 1px solid #3b3a36; border-top: 1px solid #3b3a36; min-width: 0; display: grid; gap: 3px; }
.sf:last-child { border-right: 0; }
.sf.wide { grid-column: span 4; border-right: 0; }
.sf span { font: 700 0.8125rem/1 var(--f-slate); letter-spacing: 0.12em; text-transform: uppercase; color: #9d998c; }
.sf b { font: 700 1.375rem/1.15 var(--f-slate); color: var(--chalk); overflow-wrap: anywhere; }
.sf.title b { font-size: clamp(2.25rem, 6vw, 3.75rem); line-height: 0.95; font-weight: 800; letter-spacing: -0.005em; }
.sf.wide.hash b span { font: inherit; letter-spacing: 0; text-transform: none; color: inherit; overflow-wrap: anywhere; }
.sf.wide.hash b { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; font: 400 0.8125rem/1.3 var(--f-mono); color: #bcb8ab; }
.strip { display: inline-grid; grid-template-columns: repeat(16, 14px); height: 14px; flex: none; }
.strip i { display: block; }
.strip.small { grid-template-columns: repeat(16, 6px); height: 8px; }
.lead2 { color: var(--ink-2); font-size: var(--t-l); max-width: 64ch; padding-block: 18px 6px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-block: 8px 4px; }
.btn {
  display: inline-flex; align-items: center; gap: 9px; padding: 9px 15px; border-radius: 4px; cursor: pointer; text-decoration: none;
  border: 1px solid var(--hair); background: var(--panel); color: var(--ink); font-weight: 500; font-size: var(--t-m);
}
.btn:hover { background: var(--row-hi); color: var(--ink); }
.btn.primary { background: var(--cti); border-color: var(--cti); color: #fff; }
.btn.primary:hover { background: #4a9df0; color: #fff; }
.btn small { font: 400 var(--t-xs)/1 var(--f-mono); opacity: 0.8; }
.btn[aria-disabled="true"] { opacity: 0.5; pointer-events: none; }
.fine { font-size: var(--t-xs); color: var(--ink-3); }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 30px; padding-block: 26px 60px; align-items: start; }
.prose { display: grid; gap: 28px; min-width: 0; }
.prose section { display: grid; gap: 10px; min-width: 0; }
h2.h { font-size: var(--t-l); font-weight: 600; letter-spacing: -0.01em; }
.prose p { max-width: 68ch; }
.note { border-left: 3px solid var(--queued); padding: 9px 13px; background: #29271c; max-width: 68ch; }
.undo { font-size: var(--t-s); color: var(--ink-2); }
.undo code { color: var(--ink); background: var(--panel); border: 1px solid var(--hair); border-radius: 3px; padding: 1px 6px; font-size: 0.8125rem; }
.seg { display: inline-flex; border: 1px solid var(--hair); border-radius: 4px; overflow: hidden; width: max-content; }
.seg button { background: none; border: 0; padding: 7px 12px; cursor: pointer; color: var(--ink-2); font-size: var(--t-s); }
.seg button + button { border-left: 1px solid var(--hair); }
.seg button[aria-selected="true"] { background: var(--row-hi); color: var(--ink); }
ol.steps { margin: 0; padding-left: 1.4em; display: grid; gap: 8px; max-width: 68ch; }
ol.steps li::marker { color: var(--ink-3); font-variant-numeric: tabular-nums; }
.path { font: 400 0.8125rem/1.5 var(--f-mono); background: var(--panel); border: 1px solid var(--hair); padding: 1px 6px; border-radius: 3px; overflow-wrap: anywhere; }
.code { background: #141414; border: 1px solid #0d0d0d; border-radius: 4px; max-height: 540px; overflow: auto; font: 400 0.78rem/1.6 var(--f-mono); }
.code ol { list-style: none; margin: 0; padding: 10px 0; counter-reset: ln; min-width: max-content; }
.code li { counter-increment: ln; padding-right: 16px; white-space: pre; color: #b9b9b9; }
.code li::before { content: counter(ln); display: inline-block; width: 4.4em; padding-right: 1.1em; text-align: right; color: #555; user-select: none; }
.code li.hit { background: #3a3417; color: #f2eccb; }
.code li.cave { color: #5f8fbf; }
details.src > summary { cursor: pointer; color: var(--ink-2); font-size: var(--t-s); }
details.src > summary:hover { color: var(--ink); }
details.src[open] > summary { margin-bottom: 10px; }

/* Effect Controls-style side panels */
.side { display: grid; gap: 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); min-width: 0; }
.pnl { background: var(--panel); border: 1px solid #111; border-radius: 4px; min-width: 0; }
.pnl > header { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-bottom: 1px solid #111; font-size: var(--t-s); font-weight: 600; }
.pnl > header em { font: italic 600 var(--t-s)/1 var(--f-ui); color: var(--ink-3); }
.pnl-body { padding: 6px 0; }
.prop { border-bottom: 1px solid #1d1d1d; }
.prop:last-child { border-bottom: 0; }
.prop > summary, .prop > div { list-style: none; display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; padding: 7px 12px; font-size: var(--t-s); cursor: default; }
.prop > summary { cursor: pointer; }
.prop > summary::-webkit-details-marker { display: none; }
.prop > summary::before, .prop > div::before { content: ""; width: 0; height: 0; border-left: 5px solid var(--ink-3); border-top: 4px solid transparent; border-bottom: 4px solid transparent; align-self: center; }
.prop > div::before { border-left-color: transparent; }
.prop[open] > summary::before { transform: rotate(90deg); }
.prop .v { color: var(--ink-2); font-variant-numeric: tabular-nums; text-align: right; }
.prop .v.ok { color: var(--done); } .prop .v.warn { color: var(--queued); } .prop .v.bad { color: var(--err); }
.prop-more { padding: 0 12px 10px 34px; display: grid; gap: 4px; font-size: var(--t-xs); color: var(--ink-2); }
.prop-more code { font-size: 0.7rem; color: var(--ink-3); overflow-wrap: anywhere; }
.compat { padding: 10px 12px 12px; display: grid; gap: 10px; }
.mini { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 2px; }
.mini div { display: grid; gap: 4px; justify-items: center; }
.mini i { height: 14px; width: 100%; display: block; border-radius: 1px; background: #1c1c1c; }
.mini i.works { background: var(--lc); }
.mini i.untested { background: repeating-conic-gradient(color-mix(in srgb, var(--lc) 62%, #2a2a2a) 0 25%, color-mix(in srgb, var(--lc) 26%, #2a2a2a) 0 50%) 0 0 / 6px 6px; }
.mini i.broken { background: repeating-linear-gradient(135deg, var(--err-fill) 0 3px, #4d1717 3px 6px); }
.mini span { font: 400 0.625rem/1 var(--f-mono); color: var(--ink-3); }
.mini div.sel span { color: var(--cti-ink); }
.mini div.sel i { outline: 1px solid var(--cti); outline-offset: 1px; }
.vote-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.vote-row .btn { padding: 6px 11px; font-size: var(--t-s); }

":{"status":"ok","syntax":{"level":"es3","constExtension":false,"es3Error":null,"error":null},"capabilities":[],"warnings":[],"missingIncludes":[]}},{"id":"add-flicker","version":"1.0.0","host":"aftereffects","kind":"script","category":"animation","title":{"ru":"Мерцание прозрачности","en":"Opacity Flicker"},"summary":{"ru":"Добавляет покадровое мигание Opacity выделенным слоям: от текущего кадра, на входе, на выходе или с двух сторон.","en":"Adds a frame-by-frame opacity flicker to selected layers at the current time, the in/out points or both."},"description":{"ru":"Если выделены слои (без свойств), ставит ключи Opacity 100/0 через кадр на протяжении 9 кадров. Где именно — зависит от аргумента кнопки KBar: «start» — от входа слоя, «end» — перед выходом, «both» — с обеих сторон; без аргумента (или без KBar) — от текущего кадра. Если выделены свойства, им ставятся ключи 0/100 через кадр на 10 кадров от текущего времени.","en":"With layers selected (and no properties), it sets Opacity keys alternating 100/0 every frame over 9 frames. Where they go depends on the KBar button argument: “start” — from the layer’s in-point, “end” — before its out-point, “both” — at both ends; without an argument (or outside KBar) — from the current time. If properties are selected instead, they get alternating 0/100 keys over 10 frames from the current time."},"usage":{"ru":"Выделите слои, поставьте индикатор времени туда, где начнётся мерцание, и запустите скрипт; для остальных режимов используйте кнопки KBar с аргументами start, end или both.","en":"Select layers, put the playhead where the flicker should start and run the script; for the other modes use KBar buttons with the argument start, end or both."},"notes":{"ru":"Существующие ключи в этом отрезке перезаписываются. Режим для выделенных свойств имеет смысл только для одномерных свойств; остальные молча пропускаются.","en":"Existing keys in that range are overwritten. The selected-properties mode only makes sense for one-dimensional properties; others are skipped silently."},"tags":["flicker","opacity","keyframes","glitch","kbar"],"hostVersions":{"min":null,"tested":[],"minMajor":null},"author":{"name":"Mihail","github":"SqBrain"},"license":"MIT","ai":{"level":"unknown","model":null,"humanReviewed":true},"entry":"addFlicker.jsx","added":"2026-06-01T16:26:23+03:00","updated":"2026-06-01T16:26:23+03:00","file":"dl/add-flicker.jsx","size":3440,"sha256":"c0c230164d1b781e5d9b69c6d508149c76d25460471339c41e3a30e10d3fd4ee","lines":68,"undoName":"Add Flicker","inlined":[],"checks":{"status":"ok","syntax":{"level":"es3","constExtension":false,"es3Error":null,"error":null},"capabilities":[],"warnings":[],"missingIncludes":[]}},{"id":"add-time-with-slider","version":"1.0.0","host":"aftereffects","kind":"script","category":"expressions","title":{"ru":"Экспрешен time со слайдером","en":"Time Expression with Speed Slider"},"summary":{"ru":"Задаёт выделенным свойствам экспрешен time * Speed со слайдером скорости на слое или общем Controller.","en":"Drives the selected properties with time * Speed, where Speed is a slider on the layer or a shared Controller."},"description":{"ru":"Прописывает экспрешен time*spd во все выделенные свойства, которые принимают экспрешены, и добавляет слайдер Speed (100 единиц в секунду). При одном выделенном слое слайдер ставится на него, при нескольких — на шейп-слой «Controller» (создаётся, если его нет). Подходит для бесконечного вращения или счётчиков.","en":"Sets a time*spd expression on every selected property that accepts expressions and adds a Speed slider (100 units per second). With one layer selected the slider goes on that layer; with several it goes on a shape layer named “Controller” (created if missing). Good for continuous rotation or counters."},"usage":{"ru":"Выделите свойства (например, Rotation) в таймлайне и запустите скрипт; Speed настраивается в Effect Controls.","en":"Select the properties (e.g. Rotation) in the timeline and run the script; adjust Speed in Effect Controls."},"notes":{"ru":"Экспрешен заменяет значение свойства, а не прибавляется к нему, и возвращает одно число — годится только для одномерных свойств (Rotation, Opacity, слайдеры). Каждый запуск добавляет ещё один слайдер Speed.","en":"The expression replaces the property’s value instead of adding to it and returns a single number, so it only suits one-dimensional properties (Rotation, Opacity, sliders). Each run adds another Speed slider."},"tags":["time","expressions","sliders","rotation"],"hostVersions":{"min":null,"tested":[],"minMajor":null},"author":{"name":"Mihail","github":"SqBrain"},"license":"MIT","ai":{"level":"unknown","model":null,"humanReviewed":true},"entry":"addTimeWithSlider.jsx","added":"2026-06-01T16:26:23+03:00","updated":"2026-06-01T16:26:23+03:00","file":"dl/add-time-with-slider.jsx","size":1875,"sha256":"f14b44f5ef5184920addacd22ec36a8ebcfc5d66ba082e0fe4a2bd7f6fd05443","lines":49,"undoName":"Add Time Expression","inlined":[],"checks":{"status":"ok","syntax":{"level":"es3","constExtension":false,"es3Error":null,"error":null},"capabilities":[],"warnings":[],"missingIncludes":[]}},{"id":"add-wiggle","version":"1.0.0","host":"aftereffects","kind":"script","category":"animation","title":{"ru":"Вигл со слайдерами на слое","en":"Wiggle with Layer Sliders"},"summary":{"ru":"Добавляет wiggle на выделенные свойства, а слайдеры Freq и Amp создаёт на самом слое.","en":"Adds wiggle to the selected properties, with Freq and Amp sliders placed on each layer itself."},"description":{"ru":"Для каждого выделенного слоя ищет Slider Control с именами «Freq» и «Amp» и создаёт недостающие (3 и 10), затем прописывает выделенным свойствам этого слоя экспрешен wiggle, который читает эти слайдеры. Уже существующие слайдеры переиспользуются, так что скрипт можно запускать повторно. Общего контроллера нет: у каждого слоя своя пара слайдеров.","en":"For each selected layer it looks for Slider Controls named “Freq” and “Amp”, creates whichever is missing (3 and 10), then gives that layer’s selected properties a wiggle expression that reads those sliders. Existing sliders are reused, so you can run it repeatedly. There is no shared controller: every layer gets its own pair."},"usage":{"ru":"Откройте композицию, выделите один слой и нужные свойства и запустите скрипт. Без активной композиции появится «Select composition».","en":"Open a comp, select one layer and the properties to shake, then run the script. Without an active comp it shows “Select composition”."},"notes":{"ru":"Баг: внутренний цикл использует ту же переменную i, что и внешний, поэтому при нескольких выделенных слоях часть слоёв пропускается. Надёжно работает с одним слоем за раз. Существующие экспрешены перезаписываются.","en":"Bug: the inner loop reuses the outer loop variable i, so with several layers selected some layers get skipped. Reliable with one layer at a time. Existing expressions are overwritten."},"tags":["wiggle","expressions","sliders"],"hostVersions":{"min":null,"tested":[],"minMajor":null},"author":{"name":"Mihail","github":"SqBrain"},"license":"MIT","ai":{"level":"unknown","model":null,"humanReviewed":true},"entry":"add wiggle.jsx","added":"2020-05-30T12:40:26+03:00","updated":"2020-05-30T12:40:26+03:00","file":"dl/add-wiggle.jsx","size":1549,"sha256":"860940a79d1927c81cc0e51c3f0cd805c66ffb6bbd72dd6f5db7beca033f4573","lines":52,"undoName":"add wiggle","inlined":[],"checks":{"status":"ok","syntax":{"level":"es3","constExtension":false,"es3Error":null,"error":null},"capabilities":[],"warnings":[],"missingIncludes":[]}},{"id":"add-wiggle-with-sliders","version":"1.0.0","host":"aftereffects","kind":"script","category":"animation","title":{"ru":"Вигл со слайдерами","en":"Wiggle with Slider Controls"},"summary":{"ru":"Вешает wiggle на выделенные свойства и выводит амплитуду и частоту на слайдеры Amp и Freq.","en":"Adds wiggle to the selected properties and puts amplitude and frequency on Amp and Freq sliders."},"description":{"ru":"Прописывает экспрешен wiggle(freq, amp) во все выделенные свойства, которые принимают экспрешены, и связывает его с двумя Slider Control: Amp (10) и Freq (3). Если выделен один слой, слайдеры появляются на нём самом; если несколько — на шейп-слое «Controller» (создаётся или берётся существующий), и одна пара слайдеров управляет всеми. Существующий экспрешен на свойстве заменяется.","en":"Writes a wiggle(freq, amp) expression into every selected property that accepts expressions and links it to two Slider Controls: Amp (10) and Freq (3). With one layer selected the sliders go on that layer; with several they go on a shape layer named “Controller” (created, or reused if it exists), so one pair of sliders drives them all. Any existing expression on the property is replaced."},"usage":{"ru":"Откройте композицию, выделите в таймлайне свойства, которые нужно «потрясти» (Position, Rotation и т. п.), и запустите скрипт через File > Scripts > Run Script File…. Диалогов нет — Amp и Freq крутите в Effect Controls.","en":"Open a comp, select the properties you want to shake (Position, Rotation, etc.) in the timeline and run the script via File > Scripts > Run Script File…. There is no dialog; adjust Amp and Freq in Effect Controls."},"notes":{"ru":"Каждый запуск добавляет новую пару слайдеров, даже если Amp и Freq уже есть. Если не выделено ни одного слоя, появится сообщение «No properties selected».","en":"Each run adds a new pair of sliders even if Amp and Freq already exist. With no layer selected it shows “No properties selected”."},"tags":["wiggle","expressions","sliders","controller"],"hostVersions":{"min":null,"tested":[],"minMajor":null},"author":{"name":"Mihail","github":"SqBrain"},"license":"MIT","ai":{"level":"unknown","model":null,"humanReviewed":true},"entry":"Add_Wiggle_with_Sliders.jsx","added":"2026-06-01T16:26:23+03:00","updated":"2026-06-01T16:26:23+03:00","file":"dl/add-wiggle-with-sliders.jsx","size":2089,"sha256":"51c03dd154f85ff30dc58f6d50ac66bdf419257a6ad670f6d6837ddcb465e37b","lines":53,"undoName":"Add Wiggle","inlined":[],"checks":{"status":"ok","syntax":{"level":"es3","constExtension":false,"es3Error":null,"error":null},"capabilities":[],"warnings":[],"missingIncludes":[]}},{"id":"alert-reflect","version":"1.0.0","host":"aftereffects","kind":"script","category":"utility","title":{"ru":"Инспектор свойства","en":"Inspect Property (Reflect)"},"summary":{"ru":"Инструмент для скриптеров: показывает в алерте атрибуты и методы выделенного свойства.","en":"Scripting tool: shows the attributes and methods of the selected property in an alert."},"description":{"ru":"Берёт выделенное свойство (если выделено два — второе) и через рефлексию ExtendScript выводит список его атрибутов с текущими значениями и список методов. Клавиши-модификаторы меняют вывод: Shift — атрибуты объекта значения, Ctrl — только matchName и тип значения, Alt — голый список имён атрибутов. В проекте ничего не меняется.","en":"Takes the selected property (the second one if two are selected) and uses ExtendScript reflection to list its attributes with current values and its methods. Modifier keys change the output: Shift shows the attributes of the property’s value object, Ctrl only the matchName and value type, Alt a bare list of attribute names. Nothing in the project is changed."},"usage":{"ru":"Откройте композицию, выделите свойство в таймлайне и запустите скрипт (при необходимости удерживая Shift, Ctrl или Alt). Результат появится в окне алерта.","en":"Open a comp, select a property in the timeline and run the script, optionally holding Shift, Ctrl or Alt. The result appears in an alert window."},"notes":{"ru":"На macOS проверяется именно Ctrl, а не Cmd.","en":"On macOS the script checks Ctrl, not Cmd."},"tags":["developer","reflection","properties","debug"],"hostVersions":{"min":null,"tested":[],"minMajor":null},"author":{"name":"Mihail","github":"SqBrain"},"license":"MIT","ai":{"level":"unknown","model":null,"humanReviewed":true},"entry":"Alert Reflect.jsx","added":"2020-05-30T12:40:26+03:00","updated":"2026-06-01T16:26:23+03:00","file":"dl/alert-reflect.jsx","size":3210,"sha256":"099944b2c3fb2e235ec03ae30d12e5c3105db4babca2eb97d68f230ef2adb402","lines":107,"undoName":null,"inlined":[],"checks":{"status":"ok","syntax":{"level":"es3","constExtension":false,"es3Error":null,"error":null},"capabilities":[],"warnings":[],"missingIncludes":[]}},{"id":"align-points","version":"1.0.0","host":"aftereffects","kind":"script","category":"masks-shapes","title":{"ru":"Выравнивание точек пути","en":"Align Path Points"},"summary":{"ru":"Привязывает вершины выделенных путей шейп-слоя к целым и половинным пикселям — и на всех ключах.","en":"Snaps the vertices of the selected shape paths to whole or half pixels, on every keyframe too."},"description":{"ru":"Для каждого выделенного свойства Path шейп-слоя округляет координаты всех вершин до ближайших 0,5 px — на каждом ключевом кадре, если путь анимирован, иначе в статичном значении. Касательные не трогаются; пути масок не обрабатываются.","en":"For each selected shape Path property it rounds every vertex coordinate to the nearest 0.5 px — on every keyframe if the path is animated, otherwise on the static value. Tangents are left alone; mask paths are not handled."},"usage":{"ru":"Выделите свойства Path внутри Contents шейп-слоя и запустите скрипт.","en":"Select Path properties inside a shape layer’s Contents and run the script."},"notes":{"ru":"Оставлен отладочный алерт: список вершин выводится для каждого пути и каждого ключа, на длинной анимации это утомительно. Пересекается с round-path-points.","en":"A leftover debug alert lists the vertices for every path and every keyframe, which gets tedious on long animations. Overlaps with round-path-points."},"tags":["paths","shape-layer","pixel-snapping","keyframes"],"hostVersions":{"min":null,"tested":[],"minMajor":null},"author":{"name":"Mihail","github":"SqBrain"},"license":"MIT","ai":{"level":"unknown","model":null,"humanReviewed":true},"entry":"alignPoints.jsx","added":"2026-06-01T16:26:23+03:00","updated":"2026-06-01T16:26:23+03:00","file":"dl/align-points.jsx","size":1841,"sha256":"3de7b9b5003f74a5436183c8215b0936842e2ed21f65e43d60750c07f7b5b3c6","lines":56,"undoName":"Align Points","inlined":[],"checks":{"status":"ok","syntax":{"level":"es3","constExtension":false,"es3Error":null,"error":null},"capabilities":[],"warnings":[],"missingIncludes":[]}},{"id":"animation-down-up","version":"1.0.0","host":"aftereffects","kind":"script","category":"animation","title":{"ru":"Въезд и выезд с отскоком","en":"Slide In/Out with Bounce"},"summary":{"ru":"Анимирует выделенные слои: въезд и выезд с фейдом в заданном направлении и инерционным отскоком.","en":"Animates the selected layers sliding and fading in and out in a chosen direction, with an inertial bounce."},"description":{"ru":"Добавляет каждому слою контролы Amplitude, Frequency, Decay, Angle, Driver и Offset. Слайдер Driver получает ключи −1 → 0 за первые 10 кадров и 0 → 1 за последние 10 с изингом и экспрешен отскока; Position получает экспрешен, который сдвигает слой на Offset (100 px) по направлению Angle, а Opacity проявляется и гаснет за те же кадры. Направление задаётся аргументом KBar: up (по умолчанию), down, left, right.","en":"Adds Amplitude, Frequency, Decay, Angle, Driver and Offset controls to each layer. The Driver slider is keyed −1 → 0 over the first 10 frames and 0 → 1 over the last 10 with easing, plus a bounce expression; Position gets an expression that shifts the layer by Offset (100 px) along Angle, and Opacity fades in and out over the same frames. Direction comes from the KBar argument: up (default), down, left, right."},"usage":{"ru":"Выделите слои и запустите скрипт; для других направлений используйте кнопки KBar с аргументами up, down, left или right. Offset, Angle и параметры отскока правятся в Effect Controls.","en":"Select layers and run the script; for other directions use KBar buttons with the argument up, down, left or right. Tweak Offset, Angle and the bounce sliders in Effect Controls."},"notes":{"ru":"Заменяет существующий экспрешен на Position и добавляет ключи Opacity; повторный запуск на том же слое добавит второй набор контролов.","en":"Replaces any existing Position expression and adds Opacity keys; running it again on the same layer adds a second set of controls."},"tags":["animation","bounce","slide","expressions","kbar"],"hostVersions":{"min":null,"tested":[],"minMajor":null},"author":{"name":"Mihail","github":"SqBrain"},"license":"MIT","ai":{"level":"unknown","model":null,"humanReviewed":true},"entry":"animationDownUp.jsx","added":"2026-06-01T16:26:23+03:00","updated":"2026-06-01T16:26:23+03:00","file":"dl/animation-down-up.jsx","size":17161,"sha256":"cc2c415fcf7b3a2215719d918cc66e18661201b5adbe0484844726b9b9687a07","lines":397,"undoName":"Apply Animation","inlined":["lib/constants.jsx","lib/Ease_Keyframes.jsx"],"checks":{"status":"ok","syntax":{"level":"es3","constExtension":true,"es3Error":null,"error":null},"capabilities":[],"warnings":[],"missingIncludes":[]}},{"id":"arrange-layers-to-bot-layer","version":"1.0.0","host":"aftereffects","kind":"script","category":"layers","title":{"ru":"Группировка слоёв по началу","en":"Group Layers by In-Point"},"summary":{"ru":"Ставит рядом в стеке слои с одинаковым началом и привязывает шейпы к риг-слою «Shape Layer 1».","en":"Stacks selected layers that start on the same frame together and links shapes to a “Shape Layer 1” rig."},"description":{"ru":"Попарно сравнивает выделенные слои и, если два начинаются в одно время, ставит один прямо над другим — так слои с одинаковым входом собираются вместе. Попутно каждый выделенный шейп-слой, кроме последнего, получает Round Corners и эффект Fill, у которых радиус и цвет привязаны экспрешенами к эффектам «Roundness» и «Color Control» слоя «Shape Layer 1».","en":"Compares the selected layers pairwise and, when two start at the same time, moves one directly above the other, so layers with equal in-points end up together in the stack. Along the way every selected shape layer except the last gets a Round Corners operator and a Fill effect whose radius and color are linked by expression to the “Roundness” and “Color Control” effects on a layer named “Shape Layer 1”."},"usage":{"ru":"Убедитесь, что в композиции есть «Shape Layer 1» с эффектами Roundness и Color Control, выделите слои и запустите скрипт.","en":"Make sure the comp has a “Shape Layer 1” with Roundness and Color Control effects, select the layers and run the script."},"notes":{"ru":"Сделан под конкретный проект: без слоя «Shape Layer 1» с этими эффектами добавленные экспрешены будут с ошибками. Последний выделенный слой не изменяется.","en":"Built for a specific project: without a “Shape Layer 1” carrying those effects, the added expressions will error. The last selected layer is never modified."},"tags":["layers","order","shape-layer","rig"],"hostVersions":{"min":null,"tested":[],"minMajor":null},"author":{"name":"Mihail","github":"SqBrain"},"license":"MIT","ai":{"level":"unknown","model":null,"humanReviewed":true},"entry":"arrangeLayersToBotLayer.jsx","added":"2026-06-01T16:26:23+03:00","updated":"2026-06-01T16:26:23+03:00","file":"dl/arrange-layers-to-bot-layer.jsx","size":1549,"sha256":"a629103025d61d1d7096ac38e180622e4b7078f7e17407f342c3e41cd1486b56","lines":38,"undoName":"changeOrder","inlined":[],"checks":{"status":"ok","syntax":{"level":"es3","constExtension":false,"es3Error":null,"error":null},"capabilities":[],"warnings":[],"missingIncludes":[]}},{"id":"bake-still-expression","version":"1.0.0","host":"aftereffects","kind":"script","category":"expressions","title":{"ru":"Запечь экспрешены в значения","en":"Bake Expressions to Values"},"summary":{"ru":"Заменяет экспрешены выделенных свойств их вычисленными значениями и удаляет сами экспрешены.","en":"Replaces expressions on the selected properties with their evaluated values, then removes the expressions."},"description":{"ru":"Для каждого выделенного свойства с экспрешеном: если есть ключи, каждому ключу записывается значение, которое экспрешен даёт в момент этого ключа; если ключей нет, свойство получает статичное значение экспрешена на входе слоя. Затем экспрешен удаляется. Это «статичное» запекание: покадровые ключи не создаются, и движение, которое экспрешен давал между ключами, теряется.","en":"For each selected property with an expression: if it has keyframes, each key gets the value the expression produces at that key’s time; otherwise the property gets the static value the expression gives at the layer’s in-point. The expression is then removed. It is a “still” bake: no per-frame keys are created, so motion the expression produced between keys is lost."},"usage":{"ru":"Выделите свойства с экспрешенами в таймлайне и запустите скрипт.","en":"Select properties with expressions in the timeline and run the script."},"notes":{"ru":"Если нужна вся анимация, используйте штатное Animation > Keyframe Assistant > Convert Expression to Keyframes.","en":"If you need the full animation, use the built-in Animation > Keyframe Assistant > Convert Expression to Keyframes."},"tags":["expressions","bake","keyframes","cleanup"],"hostVersions":{"min":null,"tested":[],"minMajor":null},"author":{"name":"Mihail","github":"SqBrain"},"license":"MIT","ai":{"level":"unknown","model":null,"humanReviewed":true},"entry":"bakeStillExpression.jsx","added":"2026-06-01T16:26:23+03:00","updated":"2026-06-01T16:26:23+03:00","file":"dl/bake-still-expression.jsx","size":1295,"sha256":"6194ef2d51a5262300f4c7fb3e966b8e3aff6512419fac18dce61129c14193a7","lines":30,"undoName":"Bake Expressions","inlined":[],"checks":{"status":"ok","syntax":{"level":"es3","constExtension":false,"es3Error":null,"error":null},"capabilities":[],"warnings":[],"missingIncludes":[]}},{"id":"botya-create-matte","version":"1.0.0","host":"aftereffects","kind":"script","category":"mattes","title":{"ru":"Блики и тени через матт","en":"Highlight & Shadow Mattes"},"summary":{"ru":"Собирает размытые проходы бликов или тени для выделенных слоёв из дубликатов, трек-маттов и режимов наложения.","en":"Builds blurred highlight or shadow passes for selected layers from duplicates, track mattes and blend modes."},"description":{"ru":"Для каждого выделенного слоя (кроме камер и света) создаёт скрытый дубликат «… Matte» без эффектов, но с Fast Box Blur, и второй дубликат, который использует его как трек-матт. Режим Highlight (по умолчанию) делает две такие пары — с размытием 3 и 30, режим Screen и матт Alpha Inverted; режим Shadow — одну пару с размытием 30, Multiply и матт Alpha. Если выделено несколько слоёв, создаётся (или берётся существующий) шейп-слой «Controller» со слайдерами прозрачности и размытия, и проходы привязываются к нему экспрешенами.","en":"For each selected layer (cameras and lights are skipped) it creates a hidden “… Matte” duplicate with its effects stripped and Fast Box Blur added, plus a second duplicate that uses it as a track matte. Highlight mode (the default) builds two such pairs — blur 3 and 30, Screen blending, Alpha Inverted matte; Shadow mode builds one pair with blur 30, Multiply and an Alpha matte. With several layers selected it creates (or reuses) a shape layer “Controller” with opacity and blur sliders and links the passes to it with expressions."},"usage":{"ru":"Выделите один или несколько слоёв и запустите скрипт — получатся блики. Для теней запускайте его кнопкой KBar с аргументом «Shadow» (аргумент «Highlight» — блики).","en":"Select one or more layers and run the script to get highlights. For shadows, run it from a KBar button with the argument “Shadow” (“Highlight” gives highlights)."},"notes":{"ru":"Нужен AE 2023+ (используется setTrackMatte). Эффект добавляется по английскому имени «Fast Box Blur», поэтому в локализованном AE может не сработать. В режиме Shadow с контроллером размытие тени привязано к слайдеру «Highlight Secondary Blur» — отдельного слайдера для тени нет. Если слой «Controller» уже есть, но без этих слайдеров, экспрешены выдадут ошибку.","en":"Needs AE 2023+ (uses setTrackMatte). The blur is added by its English name “Fast Box Blur”, so it may fail in localized versions of AE. In Shadow mode with a Controller the shadow blur is linked to the “Highlight Secondary Blur” slider — there is no separate shadow blur slider. If a “Controller” layer already exists without these sliders, the expressions will error."},"tags":["matte","highlight","shadow","blur","kbar"],"hostVersions":{"min":"2023 (23.0)","tested":[],"minMajor":23},"author":{"name":"Mihail","github":"SqBrain"},"license":"MIT","ai":{"level":"unknown","model":null,"humanReviewed":true},"entry":"BOTYA_createMatte.jsx","added":"2026-06-01T16:26:23+03:00","updated":"2026-06-01T16:26:23+03:00","file":"dl/botya-create-matte.jsx","size":5306,"sha256":"ff38644cb080bfda07b8a36ceeb2367a070c7d0feb812afd2931c124cf07099a","lines":119,"undoName":"Add Matte","inlined":[],"checks":{"status":"ok","syntax":{"level":"es3","constExtension":true,"es3Error":null,"error":null},"capabilities":[],"warnings":[],"missingIncludes":[]}},{"id":"change-comp-resolution","version":"1.0.0","host":"aftereffects","kind":"script","category":"comp","title":{"ru":"Размер и fps пачкой","en":"Batch Comp Size and FPS"},"summary":{"ru":"Меняет ширину, высоту и при желании fps выделенных в Project композиций; с Alt — масштаб слоёв.","en":"Changes width, height and optionally frame rate of comps selected in the Project panel; Alt sets layer scale."},"description":{"ru":"Показывает запрос «width height fps» и применяет значения ко всем композициям, выделенным в панели Project (fps можно не указывать). «mul 0.5» вместо этого умножает текущий размер. С Alt работает с выделенными слоями активной композиции и спрашивает «X Y» для Scale (слои с ключами Scale пропускаются). При смене размера композиции слои не масштабируются.","en":"Shows a prompt for “width height fps” and applies the values to every composition selected in the Project panel (fps is optional). “mul 0.5” multiplies the current size instead. With Alt held it works on the selected layers of the active comp and asks for “X Y” to set their Scale (layers with Scale keyframes are skipped). Layers are not rescaled when the comp size changes."},"usage":{"ru":"Выделите композиции в Project, запустите скрипт и введите, например, «1920 1080 25» или «mul 0.5». Для масштаба слоёв выделите их в таймлайне, запустите скрипт с зажатым Alt и введите, например, «50 50».","en":"Select comps in the Project panel, run the script and enter e.g. “1920 1080 25” or “mul 0.5”. For layer scale, select layers in the timeline, hold Alt while launching and enter e.g. “50 50”."},"notes":{"ru":"Баги: нажатие Cancel вызывает ошибку; вариант «--» (пропустить значение) реализован наполовину и ломается; «mul» в режиме Alt использует векторную арифметику, которой нет в ExtendScript, и не сработает.","en":"Bugs: pressing Cancel throws an error; the “--” (skip a value) option is half-implemented and breaks; “mul” in Alt mode uses array math that ExtendScript doesn’t support, so it fails."},"tags":["composition","resolution","frame-rate","scale","batch"],"hostVersions":{"min":null,"tested":[],"minMajor":null},"author":{"name":"Mihail","github":"SqBrain"},"license":"MIT","ai":{"level":"unknown","model":null,"humanReviewed":true},"entry":"changeCompResolution.jsx","added":"2026-06-01T16:26:23+03:00","updated":"2026-06-01T16:26:23+03:00","file":"dl/change-comp-resolution.jsx","size":3132,"sha256":"41ede9326536e27289521a017f63adc42834f469ab887c4ac6adc7dc9af9b915","lines":83,"undoName":"Change Resolutions","inlined":[],"checks":{"status":"ok","syntax":{"level":"es3","constExtension":true,"es3Error":null,"error":null},"capabilities":[],"warnings":[],"missingIncludes":[]}},{"id":"change-comps-duration","version":"1.0.0","host":"aftereffects","kind":"script","category":"comp","title":{"ru":"Длительность композиций 90 с","en":"90-Second Comp Duration"},"summary":{"ru":"Ставит длительность 90 секунд всем композициям, выделенным в панели Project.","en":"Sets the duration of every composition selected in the Project panel to 90 seconds."},"description":{"ru":"Проходит по элементам, выделенным в панели Project, и каждой композиции ставит длительность 90 секунд; остальные элементы пропускаются. Значение зашито в код. Функция названа как пакетный переименователь, но переименование и смена разрешения/fps закомментированы — работает только смена длительности.","en":"Goes through the items selected in the Project panel and sets each composition’s duration to 90 seconds; other items are skipped. The value is hard-coded. The function is named like a batch renamer, but the renaming and the resolution/frame-rate code are commented out — only the duration change is active."},"usage":{"ru":"Выделите композиции в панели Project и запустите скрипт. Диалога нет; чтобы задать другую длительность, поменяйте число 90 в коде.","en":"Select compositions in the Project panel and run the script. There is no dialog; to use another duration, change the number 90 in the code."},"notes":{"ru":"Длительность жёстко 90 с; ошибки глушатся пустым catch. Не путать с change-comps-precompose — это другой скрипт с похожим именем файла.","en":"The 90 s value is hard-coded and errors are swallowed by an empty catch. Not to be confused with change-comps-precompose, a different script with a similar file name."},"tags":["composition","duration","batch","project"],"hostVersions":{"min":null,"tested":[],"minMajor":null},"author":{"name":"Mihail","github":"SqBrain"},"license":"MIT","ai":{"level":"unknown","model":null,"humanReviewed":true},"entry":"Change Comps.jsx","added":"2026-06-01T16:26:23+03:00","updated":"2026-06-01T16:26:23+03:00","file":"dl/change-comps-duration.jsx","size":2010,"sha256":"13544c20ae55469975466e786ab6b1db987252be582722f14c555d08df6eadbe","lines":62,"undoName":"SQB rename items","inlined":[],"checks":{"status":"ok","syntax":{"level":"es3","constExtension":false,"es3Error":null,"error":null},"capabilities":[],"warnings":[],"missingIncludes":[]}},{"id":"change-comps-precompose","version":"1.0.0","host":"aftereffects","kind":"script","category":"comp","title":{"ru":"Прекомп MP4-слоёв в 25 fps","en":"Precompose MP4s at 25 fps"},"summary":{"ru":"В выделенных композициях кладёт каждый .MP4-слой в отдельный прекомп 25 fps в папке «Scenes».","en":"In the selected comps, moves every .MP4 layer into its own 25 fps precomp stored in a “Scenes” folder."},"description":{"ru":"Нужна папка «Scenes» в проекте. Для каждого элемента, выделенного в Project, создаёт в «Scenes» подпапку с его именем; в композициях каждый слой, в имени которого есть «.MP4» (заглавными), копируется в новую композицию «Scene \u003cимя> 25 fps» по размеру слоя и по его входу и выходу, и этот прекомп встаёт на место исходного слоя в то же время и в ту же позицию в стеке. Вторая функция (подгон композиций под 1920×1080 и добавление слоёв из «Source» и «Scene 2») в файле есть, но не вызывается.","en":"Needs a folder named “Scenes” in the project. For each item selected in the Project panel it creates a subfolder in “Scenes” with that item’s name; inside compositions, every layer whose name contains “.MP4” (uppercase) is copied into a new comp “Scene \u003cname> 25 fps” sized to the layer and trimmed to its in/out points, and that precomp takes the original layer’s place at the same time and stack position. A second function (resize comps to 1920×1080, add layers from “Source” and “Scene 2”) is in the file but never called."},"usage":{"ru":"Создайте в проекте папку «Scenes», выделите композиции в панели Project и запустите скрипт.","en":"Create a “Scenes” folder in the project, select the compositions in the Project panel and run the script."},"notes":{"ru":"Сделан под конкретный проект: без папки «Scenes» скрипт падает с ошибкой. Подпапка создаётся и для выделенных элементов, которые не являются композициями. Ищутся только имена с «.MP4» заглавными. Трансформации исходного слоя переезжают внутрь прекомпа — проверьте кадрирование.","en":"Built for a specific project: without a “Scenes” folder the script stops with an error. A subfolder is created even for selected items that are not comps. Only names with uppercase “.MP4” are matched. The original layer’s transforms end up inside the precomp, so check the framing."},"tags":["precompose","frame-rate","footage","batch","composition"],"hostVersions":{"min":null,"tested":[],"minMajor":null},"author":{"name":"Mihail","github":"SqBrain"},"license":"MIT","ai":{"level":"unknown","model":null,"humanReviewed":true},"entry":"changeComps;.jsx","added":"2026-06-01T16:26:23+03:00","updated":"2026-06-01T16:26:23+03:00","file":"dl/change-comps-precompose.jsx","size":4042,"sha256":"caa2d2911cd95e45d8c357152420cf61f20149ad2c887f47d59c0dd1251038b8","lines":108,"undoName":"Change Comps","inlined":[],"checks":{"status":"ok","syntax":{"level":"es3","constExtension":false,"es3Error":null,"error":null},"capabilities":[],"warnings":[],"missingIncludes":[]}},{"id":"convert-masks-to-shapes","version":"1.0.0","host":"aftereffects","kind":"script","category":"masks-shapes","title":{"ru":"Маски в шейп-слой","en":"Masks to Shape Layer"},"summary":{"ru":"Копирует выделенные маски в новый шейп-слой как контуры с белой заливкой.","en":"Copies the selected mask paths into a new shape layer as paths with a white fill."},"description":{"ru":"Создаёт шейп-слой и для каждого выделенного свойства Mask Path добавляет Path с теми же вершинами и касательными, затем добавляет белую заливку (Fill). Копируется только текущая статичная форма — ключевые кадры маски, растушёвка, расширение и режим игнорируются.","en":"Creates a shape layer and adds a Path for every selected Mask Path property, copying its vertices and tangents, then adds a white Fill. Only the current static shape is copied — mask keyframes, feather, expansion and mode are ignored."},"usage":{"ru":"Раскройте маски слоя в таймлайне (клавиша M), выделите их свойства Mask Path и запустите скрипт. Если ни один Mask Path не выделен, ничего не создаётся.","en":"Reveal the layer’s masks in the timeline (press M), select their Mask Path properties and run the script. If no Mask Path is selected, nothing is created."},"notes":{"ru":"Трансформации исходного слоя не учитываются: координаты маски заданы в пространстве исходного слоя, а начало координат нового шейп-слоя — в центре композиции, поэтому фигуры обычно оказываются смещены и их нужно подвинуть.","en":"The source layer’s transform is ignored: mask coordinates are in the source layer’s space while the new shape layer’s origin sits at the comp center, so the shapes usually end up offset and need repositioning."},"tags":["masks","shape-layer","paths","convert"],"hostVersions":{"min":null,"tested":[],"minMajor":null},"author":{"name":"Mihail","github":"SqBrain"},"license":"MIT","ai":{"level":"unknown","model":null,"humanReviewed":true},"entry":"ConvertMasksToShapes.jsx","added":"2026-06-01T16:26:23+03:00","updated":"2026-06-01T16:26:23+03:00","file":"dl/convert-masks-to-shapes.jsx","size":9236,"sha256":"dbd938028939e90a864a734c43a01eed67bcf348314ec0f1f98ca92ca7d417df","lines":213,"undoName":"Convert masks to shapes","inlined":["lib/constants.jsx"],"checks":{"status":"ok","syntax":{"level":"es3","constExtension":true,"es3Error":null,"error":null},"capabilities":[],"warnings":[],"missingIncludes":[]}},{"id":"create-and-render","version":"1.0.0","host":"aftereffects","kind":"script","category":"render","title":{"ru":"Тройки композиций в Media Encoder","en":"Queue Comp Triplets to AME"},"summary":{"ru":"Находит в выделенных папках композиции «… 1», «… 2», «… 3» и по очереди отправляет их в Media Encoder.","en":"Finds comps named “… 1”, “… 2”, “… 3” in the selected folders and queues each one in Media Encoder."},"description":{"ru":"Проходит по папкам, выделенным в Project, и ищет три подряд идущие композиции с именами на « 1», « 2» и « 3». Для каждой тройки создаёт в корне проекта композицию-обёртку с размером, длительностью и fps первой, затем по одной добавляет туда композиции — выключая предыдущий слой и переименовывая обёртку по текущей — и после каждого шага выполняет File > Export > Add to Adobe Media Encoder Queue.","en":"Walks the folders selected in the Project panel looking for three consecutive comps whose names end in “ 1”, “ 2” and “ 3”. For each triplet it creates a wrapper comp in the project root with the first comp’s size, duration and frame rate, then adds the comps one by one — switching off the previous layer and renaming the wrapper after the current comp — and runs File > Export > Add to Adobe Media Encoder Queue after each step."},"usage":{"ru":"Выделите в панели Project папки с пронумерованными композициями и запустите скрипт; откроется Adobe Media Encoder с заданиями в очереди.","en":"Select the folders with the numbered comps in the Project panel and run the script; Adobe Media Encoder opens with the jobs queued."},"notes":{"ru":"Сделан под конкретный проект. Ищет команду меню по английскому имени «Add to Adobe Media Encoder Queue...», поэтому в локализованном AE не сработает. Запускает Adobe Media Encoder; настройки рендера берутся из AME. Композиции-обёртки остаются в проекте, undo-группы нет. Композиции тройки должны идти в папке подряд (по алфавиту).","en":"Built for a specific project. It looks the menu command up by its English name “Add to Adobe Media Encoder Queue...”, so it won’t work in localized AE. It launches Adobe Media Encoder; render settings come from AME. Wrapper comps stay in the project and there is no undo group. The three comps must sit next to each other in the folder (alphabetical order)."},"tags":["render","media-encoder","export","batch"],"hostVersions":{"min":null,"tested":[],"minMajor":null},"author":{"name":"Mihail","github":"SqBrain"},"license":"MIT","ai":{"level":"unknown","model":null,"humanReviewed":true},"entry":"createAndRender.jsx","added":"2026-06-01T16:26:23+03:00","updated":"2026-06-01T16:26:23+03:00","file":"dl/create-and-render.jsx","size":2928,"sha256":"e276a11fc0731f0756f1bfd147053a87d84e69701c5463ace73e62b5fce3d2ce","lines":58,"undoName":null,"inlined":[],"checks":{"status":"ok","syntax":{"level":"es3","constExtension":true,"es3Error":null,"error":null},"capabilities":[{"id":"menu","declared":true,"detected":true,"count":3,"samples":[{"line":30,"code":"app.executeCommand(command);"},{"line":35,"code":"app.executeCommand(command);"},{"line":40,"code":"app.executeCommand(command);"}]}],"warnings":[],"missingIncludes":[]}},{"id":"create-fitting-shape-layer","version":"1.0.0","host":"aftereffects","kind":"script","category":"layers","title":{"ru":"Шейп-слой по длине выделенных","en":"Shape Layer Spanning Selection"},"summary":{"ru":"Создаёт пустой шейп-слой на весь отрезок выделенных слоёв и ставит его над ними.","en":"Adds an empty shape layer that spans the time range of the selected layers and sits above them."},"description":{"ru":"Находит самый ранний вход и самый поздний выход среди выделенных слоёв, создаёт пустой шейп-слой с этим отрезком и ставит его прямо над самым верхним из выделенных. Удобно как основа для контроллера, матта или корректирующего шейпа. Содержимого (фигур) у слоя нет.","en":"Finds the earliest in-point and the latest out-point among the selected layers, creates an empty shape layer with that range and moves it directly above the topmost selected layer. Handy as a base for a controller, a matte or an adjustment-style shape. The new layer has no contents."},"usage":{"ru":"Выделите слои в композиции и запустите скрипт.","en":"Select layers in a comp and run the script."},"notes":{"ru":"Без выделенных слоёв скрипт пытается поставить новый слой перед самим собой, что может вызвать ошибку, — выделите хотя бы один слой.","en":"With no layers selected the script tries to move the new layer before itself, which may raise an error — select at least one layer."},"tags":["shape-layer","timing","layers","controller"],"hostVersions":{"min":null,"tested":[],"minMajor":null},"author":{"name":"Mihail","github":"SqBrain"},"license":"MIT","ai":{"level":"unknown","model":null,"humanReviewed":true},"entry":"CreateFittingShapeLayer.jsx","added":"2026-06-01T16:26:23+03:00","updated":"2026-06-01T16:26:23+03:00","file":"dl/create-fitting-shape-layer.jsx","size":1656,"sha256":"042a7e1e2e0d0302fac6138ff33335a3aecfbb564a554a61b3a5ac823628fe01","lines":44,"undoName":"Create Fitting Shape Layers","inlined":[],"checks":{"status":"ok","syntax":{"level":"es3","constExtension":false,"es3Error":null,"error":null},"capabilities":[],"warnings":[],"missingIncludes":[]}},{"id":"create-palette","version":"1.0.0","host":"aftereffects","kind":"script","category":"color","title":{"ru":"Слой-палитра цветов","en":"Color Palette Layer"},"summary":{"ru":"Создаёт направляющий шейп-слой с сеткой образцов цвета, которые берутся из Color Control.","en":"Builds a guide shape layer with a grid of color swatches driven by Color Controls."},"description":{"ru":"Спрашивает «количество|размер|отступ|в ряду|скругление|имя» (по умолчанию 5|60|5|5|0|Palette) и создаёт guide-слой (не рендерится) со слайдерами Size, Spacing, Row и Round? и по одному Color Control на каждый образец. Каждый образец — группа с прямоугольником, разложенная по сетке экспрешенами; при Round? = 1 образцы становятся кругами. Цвета выбираются в Color Control, и на них удобно ссылаться из экспрешенов других слоёв.","en":"Asks for “count|size|spacing|per row|round|name” (default 5|60|5|5|0|Palette) and creates a guide layer (not rendered) with Size, Spacing, Row and Round? sliders plus one Color Control per swatch. Each swatch is a rectangle group laid out in a grid by expressions; with Round? = 1 the swatches become circles. Pick the colors in the Color Controls and reference them from other layers’ expressions."},"usage":{"ru":"Откройте композицию, запустите скрипт и заполните строку, например 8|80|10|4|1|Brand.","en":"Open a comp, run the script and fill in the prompt, e.g. 8|80|10|4|1|Brand."},"notes":{"ru":"В подсказке запроса 4-м значением указано «Round», а 5-м — «Colors in Row», но код читает их наоборот (4-е — число в ряду, 5-е — скругление); ориентируйтесь на порядок в строке по умолчанию. Позиции сетки отсчитываются от позиции первого образца.","en":"The prompt text lists “Round” as the 4th value and “Colors in Row” as the 5th, but the code reads them the other way round (4th = per row, 5th = round); follow the order of the default string. Grid positions are offset from the first swatch’s position."},"tags":["color","palette","swatches","guide-layer"],"hostVersions":{"min":null,"tested":[],"minMajor":null},"author":{"name":"Mihail","github":"SqBrain"},"license":"MIT","ai":{"level":"unknown","model":null,"humanReviewed":true},"entry":"сreatePalette.jsx","added":"2026-06-01T16:26:23+03:00","updated":"2026-06-01T16:26:23+03:00","file":"dl/create-palette.jsx","size":4329,"sha256":"35ac2b3ba963eabfbd1bccb4ef7895c57c621c9385a6d01be4f30753876b642c","lines":92,"undoName":"Create Color Palette","inlined":[],"checks":{"status":"ok","syntax":{"level":"es3","constExtension":true,"es3Error":null,"error":null},"capabilities":[],"warnings":[],"missingIncludes":[]}},{"id":"duplicate-layer-and-matte-to-selected-layers","version":"1.0.0","host":"aftereffects","kind":"script","category":"mattes","title":{"ru":"Слой в каждый трек-матт","en":"Copy Layer Into Each Matte"},"summary":{"ru":"Дублирует последний выделенный слой над каждым из остальных и делает их его альфа-маттами.","en":"Duplicates the last-selected layer above each other selected layer and uses that layer as its alpha matte."},"description":{"ru":"Источник — слой, выделенный последним. Над каждым из остальных выделенных слоёв ставится копия источника, которой этот слой назначается трек-маттом Alpha; сами матты снова включаются, так что остаются видимыми. В конце исходный слой удаляется. Удобно, чтобы залить несколько шейпов или текстов одной текстурой или футажом.","en":"The layer you select last is the source. Above each of the other selected layers the script places a copy of the source and sets that layer as its Alpha track matte; the matte layers are switched back on, so they stay visible. The original source layer is deleted at the end. Useful for filling several shapes or text layers with the same texture or footage."},"usage":{"ru":"Сначала выделите слои-матты, затем последним с Ctrl/Cmd выделите слой, который нужно размножить, и запустите скрипт.","en":"Select the matte layers first, then Ctrl/Cmd-click the layer to copy last, and run the script."},"notes":{"ru":"Нужен AE 2023+ (setTrackMatte). Порядок выделения важен: последний выделенный слой после копирования удаляется.","en":"Needs AE 2023+ (setTrackMatte). Selection order matters: the last-selected layer is deleted after copying."},"tags":["track-matte","duplicate","texture","layers"],"hostVersions":{"min":"2023 (23.0)","tested":[],"minMajor":23},"author":{"name":"Mihail","github":"SqBrain"},"license":"MIT","ai":{"level":"unknown","model":null,"humanReviewed":true},"entry":"Duplicate Layer and Matte to selected layers.jsx","added":"2026-06-01T16:26:23+03:00","updated":"2026-06-01T16:26:23+03:00","file":"dl/duplicate-layer-and-matte-to-selected-layers.jsx","size":1689,"sha256":"901bffd4dcfe32d5b5ad2a924b29b784747c24a550074c10ad7469544770efe1","lines":43,"undoName":"Dup Layer and matte to Selected Layers","inlined":[],"checks":{"status":"ok","syntax":{"level":"es3","constExtension":false,"es3Error":null,"error":null},"capabilities":[],"warnings":[],"missingIncludes":[]}},{"id":"duplicate-layer-by-masks","version":"1.0.0","host":"aftereffects","kind":"script","category":"masks-shapes","title":{"ru":"Разбить слой по маскам","en":"Split Layer by Masks"},"summary":{"ru":"Превращает слой с несколькими масками в набор слоёв — по одной маске на каждом.","en":"Turns one layer with several masks into separate layers, one mask per layer."},"description":{"ru":"Берёт первый выделенный слой и создаёт по дубликату на каждую маску, удаляя в каждой копии все маски, кроме своей. В конце исходный слой удаляется.","en":"Takes the first selected layer and creates one duplicate per mask, deleting every mask on each copy except its own. The original layer is removed at the end."},"usage":{"ru":"Выделите слой с масками и запустите скрипт.","en":"Select a layer with masks and run the script."},"notes":{"ru":"Если масок у слоя нет, скрипт просто удалит слой (вернуть можно через Undo). Без выделенного слоя скрипт падает с ошибкой.","en":"If the layer has no masks, the script simply deletes it (Undo brings it back). With no layer selected it throws an error."},"tags":["masks","split","duplicate","layers"],"hostVersions":{"min":null,"tested":[],"minMajor":null},"author":{"name":"Mihail","github":"SqBrain"},"license":"MIT","ai":{"level":"unknown","model":null,"humanReviewed":true},"entry":"duplicateLayerByMasks.jsx","added":"2026-06-01T16:26:23+03:00","updated":"2026-06-01T16:26:23+03:00","file":"dl/duplicate-layer-by-masks.jsx","size":1044,"sha256":"3e86d755292301a7803766d851ca3aaf9048a2e549ddb7a446856d5d6af26917","lines":26,"undoName":"Duplicate Layer by masks","inlined":[],"checks":{"status":"ok","syntax":{"level":"es3","constExtension":true,"es3Error":null,"error":null},"capabilities":[],"warnings":[],"missingIncludes":[]}},{"id":"duplicate-layer-or-shape","version":"1.0.0","host":"aftereffects","kind":"script","category":"layers","title":{"ru":"Дубликатор слоёв и групп","en":"Duplicate Layers or Shape Groups"},"summary":{"ru":"Дублирует выделенные слои или группы внутри шейп-слоя заданное число раз.","en":"Duplicates the selected layers, or selected groups inside a shape layer, a given number of times."},"description":{"ru":"Спрашивает число N. Если выделен один шейп-слой и внутри его Contents выделены элементы, дублируются эти группы и фигуры; иначе дублируется каждый выделенный слой. N — итоговое количество вместе с оригиналом: при 3 появятся две копии. Ошибки показываются в алерте.","en":"Asks for a number N. If one shape layer is selected and items inside its Contents are selected, those groups and shapes are duplicated in place; otherwise every selected layer is duplicated. N is the total count including the original, so 3 gives two new copies. Errors are shown in an alert."},"usage":{"ru":"Выделите слои (или группы в Contents одного шейп-слоя), запустите скрипт и введите число.","en":"Select layers (or groups in the Contents of one shape layer), run the script and enter the number."},"notes":{"ru":"Индексы слоёв сортируются как строки, поэтому если выделены слои и выше, и ниже 10-го, могут продублироваться не те слои. Если у одиночного шейп-слоя выделено свойство вне Contents (например, в Transform), ничего не произойдёт.","en":"Layer indices are sorted as strings, so a selection spanning layers both above and below index 10 can duplicate the wrong layers. If a property outside Contents (e.g. in Transform) is selected on a single shape layer, nothing happens."},"tags":["duplicate","shape-layer","layers","batch"],"hostVersions":{"min":null,"tested":[],"minMajor":null},"author":{"name":"Mihail","github":"SqBrain"},"license":"MIT","ai":{"level":"unknown","model":null,"humanReviewed":true},"entry":"Duplicate Layer or Shape.jsx","added":"2026-06-01T16:26:23+03:00","updated":"2026-06-01T16:26:23+03:00","file":"dl/duplicate-layer-or-shape.jsx","size":3430,"sha256":"fbe7cd81657ba1835bbd80ba29c0cdc3f5290131f83e3881f0e4d6fe4e6ed1b2","lines":78,"undoName":"Duplicator","inlined":[],"checks":{"status":"ok","syntax":{"level":"es3","constExtension":false,"es3Error":null,"error":null},"capabilities":[],"warnings":[],"missingIncludes":[]}},{"id":"expressions-helper","version":"1.0.0","host":"aftereffects","kind":"script","category":"expressions","title":{"ru":"Заготовки экспрешенов","en":"Expression Snippet Inserter"},"summary":{"ru":"Дописывает в начало экспрешена готовые строки: индекс группы, random со слайдерами, frameDuration, ссылки на слои.","en":"Prepends ready-made lines to expressions: group index, random with sliders, frameDuration, layer links."},"description":{"ru":"Рассчитан на кнопки KBar: аргумент кнопки выбирает режим — shapeIndexExpr (индекс родительской группы шейпа; режим по умолчанию без KBar), indexExpr и reverseIndexExpr (смещение индекса от последнего выделенного слоя), mainLayer (ссылка на последний выделенный слой), random (добавляет слайдеры Seed, Min и Max и строки seedRandom/random), frameDur, compHalf, mainProps, pathPoints, relativeShapePath. Строки вставляются перед существующим экспрешеном каждого выделенного свойства; только режим random дополнительно создаёт слайдеры на слое.","en":"Built for KBar buttons: the button argument picks the mode — shapeIndexExpr (index of the parent shape group; the default without KBar), indexExpr and reverseIndexExpr (index offset from the last selected layer), mainLayer (link to the last selected layer), random (adds Seed, Min and Max sliders plus seedRandom/random lines), frameDur, compHalf, mainProps, pathPoints, relativeShapePath. Lines are inserted before the existing expression of each selected property; only random mode also adds sliders to the layer."},"usage":{"ru":"Выделите одно или несколько свойств в таймлайне и запустите скрипт (или кнопку KBar с одним из аргументов выше). Режим random спрашивает имя переменной.","en":"Select one or more properties in the timeline and run the script (or a KBar button with one of the arguments above). Random mode asks for a variable name."},"notes":{"ru":"Без KBar доступен только shapeIndexExpr. Баги: compHalf заменяет найденные фрагменты словом «undefined» и может упасть с ReferenceError (переменная fVar там не объявлена); при повторных random имена копятся вида «Min Val 2 3».","en":"Without KBar only shapeIndexExpr is available. Bugs: compHalf replaces the matched text with the word “undefined” and can throw a ReferenceError (fVar is not defined there); repeated random runs produce names like “Min Val 2 3”."},"tags":["expressions","snippets","kbar","shape-layer","random"],"hostVersions":{"min":null,"tested":[],"minMajor":null},"author":{"name":"Mihail","github":"SqBrain"},"license":"MIT","ai":{"level":"unknown","model":null,"humanReviewed":true},"entry":"Expressions Helper.jsx","added":"2026-06-01T16:26:23+03:00","updated":"2026-06-01T16:26:23+03:00","file":"dl/expressions-helper.jsx","size":11771,"sha256":"20568332da097b6c94dac50893bb65bd5e7e1875dd3cb91f13d02bb8dc0fa481","lines":308,"undoName":"SQB Add to expression","inlined":[],"checks":{"status":"ok","syntax":{"level":"es3","constExtension":true,"es3Error":null,"error":null},"capabilities":[],"warnings":[],"missingIncludes":[]}},{"id":"link-opacity-to-parent","version":"1.0.0","host":"aftereffects","kind":"script","category":"expressions","title":{"ru":"Opacity от родителя","en":"Link Opacity to Parent"},"summary":{"ru":"Привязывает Opacity выделенных дочерних слоёв к Opacity родителя через экспрешен.","en":"Makes the opacity of the selected child layers follow their parent’s opacity via an expression."},"description":{"ru":"Каждому выделенному слою с родителем прописывает экспрешен на Opacity, который берёт прозрачность родителя по его имени. Слои без родителя пропускаются. Собственное значение прозрачности дочернего слоя игнорируется (не перемножается).","en":"For each selected layer that has a parent, writes an Opacity expression that reads the parent’s opacity by layer name. Layers without a parent are skipped. The child’s own opacity value is ignored rather than multiplied."},"usage":{"ru":"Привяжите слои к родителю как обычно, выделите дочерние и запустите скрипт.","en":"Parent the layers as usual, select the children and run the script."},"notes":{"ru":"Связь идёт по имени родителя: переименование родителя или два слоя с одинаковым именем ломают её.","en":"The link uses the parent’s name, so renaming the parent or having two layers with the same name breaks it."},"tags":["opacity","parenting","expressions","rig"],"hostVersions":{"min":null,"tested":[],"minMajor":null},"author":{"name":"Mihail","github":"SqBrain"},"license":"MIT","ai":{"level":"unknown","model":null,"humanReviewed":true},"entry":"linkOpacityToParent.jsx","added":"2026-06-01T16:26:23+03:00","updated":"2026-06-01T16:26:23+03:00","file":"dl/link-opacity-to-parent.jsx","size":923,"sha256":"547bcb04c85b9c82e18d92d2fbae8567462b6a99dd79e076eeef329bb5c04222","lines":23,"undoName":"Link Opacity to parent","inlined":[],"checks":{"status":"ok","syntax":{"level":"es3","constExtension":false,"es3Error":null,"error":null},"capabilities":[],"warnings":[],"missingIncludes":[]}},{"id":"loop-footage","version":"1.0.0","host":"aftereffects","kind":"script","category":"layers","title":{"ru":"Зациклить футаж","en":"Loop Footage with Time Remap"},"summary":{"ru":"Включает Time Remapping на выделенных слоях и зацикливает их обрезанный отрезок через loopOut().","en":"Enables Time Remapping on the selected layers and loops their trimmed range with loopOut()."},"description":{"ru":"Каждому выделенному слою, который поддерживает ремап времени, включает Time Remapping, ставит ключи на входе и за кадр до выхода, добавляет ещё один ключ кадром позже со значением начала, удаляет лишние ключи и вешает loopOut(). Получается бесшовный цикл видимой части клипа.","en":"For each selected layer that supports time remapping, it enables Time Remapping, sets keys at the in-point and one frame before the out-point, adds one more key a frame later that jumps back to the start value, removes extra keys and applies loopOut(). The result is a seamless cycle of the visible part of the clip."},"usage":{"ru":"Обрежьте футаж или прекомп до нужного куска, выделите слои и запустите скрипт.","en":"Trim the footage or precomp layers to the part you want to loop, select them and run the script."},"notes":{"ru":"Выход слоя не продлевается — растяните слой сами, чтобы увидеть цикл. Прежние ключи ремапа могут быть заменены.","en":"The layer’s out-point is not extended — drag it out yourself to see the loop. Previous time-remap keys may be replaced."},"tags":["loop","time-remapping","footage","expressions"],"hostVersions":{"min":null,"tested":[],"minMajor":null},"author":{"name":"Mihail","github":"SqBrain"},"license":"MIT","ai":{"level":"unknown","model":null,"humanReviewed":true},"entry":"loopFootage.jsx","added":"2026-06-01T16:26:23+03:00","updated":"2026-06-01T16:26:23+03:00","file":"dl/loop-footage.jsx","size":1630,"sha256":"be717e3374aeca4e34920b9d2913b8aa9dc16eb1b7f6393e05d4439cb9e1233a","lines":38,"undoName":"Loop Footage","inlined":[],"checks":{"status":"ok","syntax":{"level":"es3","constExtension":false,"es3Error":null,"error":null},"capabilities":[],"warnings":[],"missingIncludes":[]}},{"id":"made-bunch-of-masks","version":"1.0.0","host":"aftereffects","kind":"script","category":"animation","title":{"ru":"Распад слоя на плитки","en":"Tile Disintegration Transition"},"summary":{"ru":"Режет слой на сетку плиток-масок, которые от текущего кадра уменьшаются и смещаются.","en":"Cuts a layer into a grid of masked tiles that shrink and drift away from the current time."},"description":{"ru":"Задумано так: каждый выделенный футажный слой режется на плитки (10 колонок) — каждая плитка это дубликат с квадратной маской, которая за 0,5 с превращается в скруглённую фигуру, пока Position смещается на (−50, −30) px, а Scale уходит в 0; исходный слой выключается. Все плитки стартуют одновременно. Вспомогательная функция для разнесения слоёв по времени есть, но не используется.","en":"The intent: each selected footage layer is cut into tiles (10 columns) — every tile is a duplicate with a square mask that morphs into a rounded shape over 0.5 s while its Position drifts by (−50, −30) px and Scale goes to 0; the original layer is switched off. All tiles start at the same time. A helper for staggering layers in time is present but unused."},"usage":{"ru":"(После исправления include) в

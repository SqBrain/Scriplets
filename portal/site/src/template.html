<title>VFX Cave</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Free After Effects scripts written by artists, by hand or with AI. Every file is parsed for ExtendScript, scanned for risky calls and hashed before it's listed.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Sofia+Sans+Extra+Condensed:wght@500;700;800&display=swap">
<style>
/* Layout: the catalog is a composition. A panel-tab strip on top, a short
   statement and search, then the timeline: layer rows (label, name, capability
   switches) on the left and a ruler of After Effects versions on the right with
   a draggable playhead. Script pages open with a slate. One dark world built
   from AE's panel greys, coloured only by the 16 AE label colours. */
:root {
  --well: #181818;      /* page, panel well */
  --panel: #222222;     /* panels, timeline body */
  --row: #2a2a2a;       /* layer rows */
  --row-hi: #383838;    /* hovered / selected layer */
  --hair: #3a3a3a;      /* row separators, panel edges */
  --ink: #e4e4e4;       /* primary text */
  --ink-2: #a6a6a6;     /* secondary text */
  --ink-3: #747474;     /* tertiary text, unlit switches */
  --cti: #2d8ceb;       /* current-time indicator: the playhead */
  --cti-ink: #67adf3;   /* playhead blue for text on dark */
  --done: #4aa44c;      /* render queue: Done (label Green) */
  --queued: #e4d84c;    /* render queue: Queued (label Yellow) */
  --err: #e35d5d;       /* render queue: Err Stopped (label Red, lifted for text) */
  --err-fill: #b53838;
  --chalk: #ece8dc;     /* slate chalk */
  --slate: #121212;     /* slate board */
  /* After Effects default label colours, 1–16 */
  --l-red: #b53838; --l-yellow: #e4d84c; --l-aqua: #a9cbc7; --l-pink: #e5bcc9;
  --l-lavender: #a9a9ca; --l-peach: #e7c19e; --l-seafoam: #b3c7b3; --l-blue: #677de0;
  --l-green: #4aa44c; --l-purple: #8e2c9a; --l-orange: #e8920d; --l-brown: #7f452a;
  --l-fuchsia: #f46dd6; --l-cyan: #3da2a5; --l-sandstone: #a89677; --l-darkgreen: #1e401e;
  --f-ui: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --f-slate: "Sofia Sans Extra Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --t-xs: 0.75rem; --t-s: 0.8125rem; --t-m: 0.9375rem; --t-l: 1.125rem; --t-xl: 1.625rem; --t-xxl: 2.75rem;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--well); }
body { margin: 0; background: var(--well); color: var(--ink); font: 400 var(--t-m)/1.55 var(--f-ui); min-height: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
a { color: var(--cti-ink); text-underline-offset: 3px; }
a:hover { color: var(--ink); }
:focus-visible { outline: 2px solid var(--cti); outline-offset: 2px; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
code, pre { font-family: var(--f-mono); }
.wrap {
  max-width: 1200px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------------- panel-tab strip ---------------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--panel); border-bottom: 1px solid #111; }
.bar-in { display: flex; align-items: stretch; gap: 22px; min-height: 48px; }
.mark { display: flex; align-items: center; gap: 9px; color: var(--ink); text-decoration: none; font-weight: 700; letter-spacing: -0.01em; font-size: 1.0625rem; }
.mark:hover { color: var(--ink); }
.ease { /* the Easy Ease keyframe glyph */
  width: 11px; height: 14px; background: var(--ink); flex: none;
  clip-path: polygon(0 0, 100% 0, 58% 50%, 100% 100%, 0 100%, 42% 50%);
}
.mark:hover .ease { background: var(--cti); }
.tabs { display: flex; align-items: stretch; margin-right: auto; overflow-x: auto; scrollbar-width: none; }
.tabs a {
  display: flex; align-items: center; padding: 0 13px; color: var(--ink-2); text-decoration: none; font-size: var(--t-s);
  border-left: 1px solid transparent; border-right: 1px solid transparent; white-space: nowrap;
}
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { color: var(--ink); background: var(--well); border-color: #111; box-shadow: inset 0 2px 0 var(--cti); }
.bar-side { display: flex; align-items: center; gap: 12px; }
.xp { color: var(--ink-2); text-decoration: none; font-size: var(--t-s); white-space: nowrap; }
.xp b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.lang { display: flex; border: 1px solid var(--hair); border-radius: 3px; overflow: hidden; }
.lang button { background: none; border: 0; padding: 4px 8px; cursor: pointer; color: var(--ink-3); font-size: var(--t-xs); font-weight: 600; }
.lang button[aria-pressed="true"] { background: var(--hair); color: var(--ink); }

/* ---------------- hero ---------------- */
.hero { padding-block: 46px 26px; display: grid; gap: 18px; }
.hero h1 { font-size: var(--t-xxl); line-height: 1.04; font-weight: 700; letter-spacing: -0.035em; max-width: 19ch; }
.hero p { color: var(--ink-2); font-size: var(--t-l); max-width: 60ch; line-height: 1.5; }
.find { display: flex; align-items: center; gap: 10px; max-width: 560px; background: var(--panel); border: 1px solid var(--hair); border-radius: 4px; padding: 0 12px; }
.find:focus-within { border-color: var(--cti); }
.find svg { flex: none; color: var(--ink-3); }
.find input { flex: 1; min-width: 0; background: none; border: 0; outline: none; padding: 11px 0; font-size: var(--t-m); }
.find input::placeholder { color: var(--ink-3); }
.find kbd { font: 500 var(--t-xs)/1 var(--f-mono); color: var(--ink-3); border: 1px solid var(--hair); border-radius: 3px; padding: 3px 6px; }

/* ---------------- composition (timeline) ---------------- */
.comp { background: var(--panel); border: 1px solid #111; border-radius: 4px; margin-bottom: 56px; }
.comp-head { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "ctd opts" "labels labels"; gap: 14px 26px; align-items: end; padding: 14px 16px; border-bottom: 1px solid #111; }
.comp-head .ctd { grid-area: ctd; }
.comp-head .opts { grid-area: opts; justify-content: flex-end; }
.comp-head .labels { grid-area: labels; }
.ctd { display: grid; gap: 2px; }
.ctd span { font-size: var(--t-xs); color: var(--ink-3); }
.ctd output { font: 500 1.5rem/1 var(--f-mono); color: var(--cti-ink); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.ctd small { font-size: var(--t-xs); color: var(--ink-2); }
.labels { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
.lbl {
  display: inline-flex; align-items: center; gap: 7px; padding: 4px 8px 4px 6px; border-radius: 3px; cursor: pointer;
  background: transparent; border: 1px solid transparent; color: var(--ink-2); font-size: var(--t-s); line-height: 1.2;
}
.lbl:hover { background: var(--row); color: var(--ink); }
.lbl i { width: 11px; height: 11px; border-radius: 2px; background: var(--lc, var(--ink-3)); flex: none; }
.lbl small { color: var(--ink-3); font-variant-numeric: tabular-nums; }
.lbl[aria-pressed="true"] { background: var(--row-hi); border-color: #4a4a4a; color: var(--ink); }
.opts { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.opts label { display: inline-flex; gap: 7px; align-items: center; font-size: var(--t-s); color: var(--ink-3); }
select, input[type="text"], textarea {
  background: var(--well); border: 1px solid var(--hair); border-radius: 3px; padding: 5px 8px; font-size: var(--t-s);
}
select:focus, input[type="text"]:focus, textarea:focus { border-color: var(--cti); outline: none; }

.tl { --cols: 2.6rem 4px minmax(0, 1fr) 8.4rem minmax(15rem, 34%) 7.4rem; position: relative; }
.tl-head, .row { display: grid; grid-template-columns: var(--cols); align-items: center; }
.tl-head { height: 40px; border-bottom: 1px solid #111; font-size: var(--t-xs); color: var(--ink-3); background: var(--panel); position: sticky; top: calc(env(safe-area-inset-top, 0px) + 48px); z-index: 3; }
.tl-head > span { padding: 0 8px; }
.sw-head, .sw { display: grid; grid-template-columns: repeat(5, 1fr); justify-items: center; align-items: center; height: 100%; border-left: 1px solid #1a1a1a; border-right: 1px solid #1a1a1a; }
.sw-head svg { color: var(--ink-3); }
.ruler { position: relative; height: 100%; cursor: ew-resize; touch-action: none; user-select: none; }
.ticks { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(var(--n), 1fr); }
.ticks button {
  all: unset; cursor: pointer; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 3px;
  padding-bottom: 5px; font: 400 0.6875rem/1 var(--f-mono); color: var(--ink-3); position: relative;
}
.ticks button::after { content: ""; width: 1px; height: 6px; background: #555; }
.ticks button[aria-current="true"] { color: var(--cti-ink); }
.ticks button:focus-visible { outline: 2px solid var(--cti); }
.cti-head { /* the playhead handle */
  position: absolute; top: 3px; width: 13px; height: 13px; margin-left: -6px; background: var(--cti);
  clip-path: polygon(0 0, 100% 0, 100% 55%, 50% 100%, 0 55%); pointer-events: none;
}
.rows { margin: 0; padding: 0; }
.row {
  min-height: 52px; color: var(--ink); text-decoration: none; background: var(--row); border-bottom: 1px solid #1c1c1c;
  position: relative;
}
.row:hover, .row:focus-visible { background: var(--row-hi); color: var(--ink); }
.row:focus-visible { outline-offset: -2px; }
.row.out { opacity: 0.42; }
.row .idx { font: 400 var(--t-xs)/1 var(--f-mono); color: var(--ink-3); text-align: right; padding-right: 10px; font-variant-numeric: tabular-nums; }
.row .lc { align-self: stretch; background: var(--lc); }
.row .nm { padding: 8px 12px; min-width: 0; display: grid; gap: 1px; }
.row .nm b { font-weight: 500; font-size: var(--t-m); line-height: 1.3; }
.row .nm span { color: var(--ink-2); font-size: var(--t-s); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sw span { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 3px; color: #4b4b4b; position: relative; }
.sw span.on { color: var(--ink-2); background: #1f1f1f; }
.sw span.risk { color: var(--err); }
.sw span.undeclared::after { content: ""; position: absolute; top: 2px; right: 2px; width: 5px; height: 5px; border-radius: 50%; background: var(--queued); }
.trk { position: relative; align-self: stretch; display: grid; grid-template-columns: repeat(var(--n), 1fr); align-items: center; padding: 0; }
.trk i { height: 16px; display: block; }
.trk i.works { background: var(--lc); }
.trk i.untested {
  background:
    repeating-conic-gradient(color-mix(in srgb, var(--lc) 62%, #2a2a2a) 0 25%, color-mix(in srgb, var(--lc) 26%, #2a2a2a) 0 50%) 0 0 / 8px 8px;
}
.trk i.broken { background: repeating-linear-gradient(135deg, var(--err-fill) 0 4px, #4d1717 4px 8px); }
.trk i.first { position: relative; border-radius: 2px 0 0 2px; }
.trk i.first::before { /* release keyframe */
  content: ""; position: absolute; left: -4px; top: 50%; width: 8px; height: 8px; background: var(--ink); transform: translateY(-50%) rotate(45deg);
}
.trk i.last { border-radius: 0 2px 2px 0; }
.cti-line { position: absolute; top: 0; bottom: -1px; width: 1px; background: var(--cti); pointer-events: none; z-index: 1; }
.rq { padding: 0 12px; font-size: var(--t-s); display: flex; align-items: center; gap: 7px; white-space: nowrap; }
.rq::before { content: ""; width: 8px; height: 8px; border-radius: 1px; background: currentColor; flex: none; }
.rq.ok { color: var(--done); }
.rq.review { color: var(--queued); }
.rq.blocked { color: var(--err); }
.rq.needs { color: var(--ink-2); }
.rq.needs::before { background: transparent; border: 1px solid currentColor; }
.empty { padding: 34px 16px; color: var(--ink-2); text-align: center; background: var(--row); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 22px; padding: 12px 16px; border-top: 1px solid #111; font-size: var(--t-xs); color: var(--ink-3); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { width: 22px; height: 10px; display: inline-block; --lc: var(--l-aqua); border-radius: 2px; }
.legend i.works { background: var(--lc); }
.legend i.untested { background: repeating-conic-gradient(color-mix(in srgb, var(--lc) 62%, #2a2a2a) 0 25%, color-mix(in srgb, var(--lc) 26%, #2a2a2a) 0 50%) 0 0 / 6px 6px; }
.legend i.broken { background: repeating-linear-gradient(135deg, var(--err-fill) 0 3px, #4d1717 3px 6px); }
.legend b { font-weight: 500; }
.legend .ok { color: var(--done); } .legend .review { color: var(--queued); } .legend .blocked { color: var(--err); }
.opts .ver-pick { display: none; }

/* ---------------- script page ---------------- */
.crumbs { padding-block: 22px 14px; font-size: var(--t-s); color: var(--ink-3); display: flex; gap: 8px; flex-wrap: wrap; }
.crumbs a { color: var(--ink-2); text-decoration: none; }
.crumbs a:hover { color: var(--ink); }
.slate { background: var(--slate); color: var(--chalk); border-radius: 4px; overflow: hidden; border: 1px solid #000; }
.sticks { position: relative; height: 38px; background: #0b0b0b; }
.stick {
  position: absolute; left: 0; right: 0; height: 19px;
  background: repeating-linear-gradient(-55deg, var(--chalk) 0 22px, #141414 22px 44px);
}
.stick.bottom { bottom: 0; }
.stick.top { top: 0; transform-origin: 6px 100%; transform: rotate(-4deg); transition: transform 0.12s ease-in; }
.slate.done .stick { background: repeating-linear-gradient(-55deg, #bfbfbf 0 22px, #bfbf00 22px 44px, #00bfbf 44px 66px, #00bf00 66px 88px, #bf00bf 88px 110px, #bf0000 110px 132px, #0000bf 132px 154px); }
.slate.clap .stick.top { transform: rotate(0deg); }
.slate-body { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.sf { padding: 10px 14px 12px; border-right: 1px solid #3b3a36; border-top: 1px solid #3b3a36; min-width: 0; display: grid; gap: 3px; }
.sf:last-child { border-right: 0; }
.sf.wide { grid-column: span 4; border-right: 0; }
.sf span { font: 700 0.8125rem/1 var(--f-slate); letter-spacing: 0.12em; text-transform: uppercase; color: #9d998c; }
.sf b { font: 700 1.375rem/1.15 var(--f-slate); color: var(--chalk); overflow-wrap: anywhere; }
.sf.title b { font-size: clamp(2.25rem, 6vw, 3.75rem); line-height: 0.95; font-weight: 800; letter-spacing: -0.005em; }
.sf.wide.hash b span { font: inherit; letter-spacing: 0; text-transform: none; color: inherit; overflow-wrap: anywhere; }
.sf.wide.hash b { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; font: 400 0.8125rem/1.3 var(--f-mono); color: #bcb8ab; }
.strip { display: inline-grid; grid-template-columns: repeat(16, 14px); height: 14px; flex: none; }
.strip i { display: block; }
.strip.small { grid-template-columns: repeat(16, 6px); height: 8px; }
.lead2 { color: var(--ink-2); font-size: var(--t-l); max-width: 64ch; padding-block: 18px 6px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-block: 8px 4px; }
.btn {
  display: inline-flex; align-items: center; gap: 9px; padding: 9px 15px; border-radius: 4px; cursor: pointer; text-decoration: none;
  border: 1px solid var(--hair); background: var(--panel); color: var(--ink); font-weight: 500; font-size: var(--t-m);
}
.btn:hover { background: var(--row-hi); color: var(--ink); }
.btn.primary { background: var(--cti); border-color: var(--cti); color: #fff; }
.btn.primary:hover { background: #4a9df0; color: #fff; }
.btn small { font: 400 var(--t-xs)/1 var(--f-mono); opacity: 0.8; }
.btn[aria-disabled="true"] { opacity: 0.5; pointer-events: none; }
.fine { font-size: var(--t-xs); color: var(--ink-3); }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 30px; padding-block: 26px 60px; align-items: start; }
.prose { display: grid; gap: 28px; min-width: 0; }
.prose section { display: grid; gap: 10px; min-width: 0; }
h2.h { font-size: var(--t-l); font-weight: 600; letter-spacing: -0.01em; }
.prose p { max-width: 68ch; }
.note { border-left: 3px solid var(--queued); padding: 9px 13px; background: #29271c; max-width: 68ch; }
.undo { font-size: var(--t-s); color: var(--ink-2); }
.undo code { color: var(--ink); background: var(--panel); border: 1px solid var(--hair); border-radius: 3px; padding: 1px 6px; font-size: 0.8125rem; }
.seg { display: inline-flex; border: 1px solid var(--hair); border-radius: 4px; overflow: hidden; width: max-content; }
.seg button { background: none; border: 0; padding: 7px 12px; cursor: pointer; color: var(--ink-2); font-size: var(--t-s); }
.seg button + button { border-left: 1px solid var(--hair); }
.seg button[aria-selected="true"] { background: var(--row-hi); color: var(--ink); }
ol.steps { margin: 0; padding-left: 1.4em; display: grid; gap: 8px; max-width: 68ch; }
ol.steps li::marker { color: var(--ink-3); font-variant-numeric: tabular-nums; }
.path { font: 400 0.8125rem/1.5 var(--f-mono); background: var(--panel); border: 1px solid var(--hair); padding: 1px 6px; border-radius: 3px; overflow-wrap: anywhere; }
.code { background: #141414; border: 1px solid #0d0d0d; border-radius: 4px; max-height: 540px; overflow: auto; font: 400 0.78rem/1.6 var(--f-mono); }
.code ol { list-style: none; margin: 0; padding: 10px 0; counter-reset: ln; min-width: max-content; }
.code li { counter-increment: ln; padding-right: 16px; white-space: pre; color: #b9b9b9; }
.code li::before { content: counter(ln); display: inline-block; width: 4.4em; padding-right: 1.1em; text-align: right; color: #555; user-select: none; }
.code li.hit { background: #3a3417; color: #f2eccb; }
.code li.cave { color: #5f8fbf; }
details.src > summary { cursor: pointer; color: var(--ink-2); font-size: var(--t-s); }
details.src > summary:hover { color: var(--ink); }
details.src[open] > summary { margin-bottom: 10px; }

/* Effect Controls-style side panels */
.side { display: grid; gap: 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); min-width: 0; }
.pnl { background: var(--panel); border: 1px solid #111; border-radius: 4px; min-width: 0; }
.pnl > header { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-bottom: 1px solid #111; font-size: var(--t-s); font-weight: 600; }
.pnl > header em { font: italic 600 var(--t-s)/1 var(--f-ui); color: var(--ink-3); }
.pnl-body { padding: 6px 0; }
.prop { border-bottom: 1px solid #1d1d1d; }
.prop:last-child { border-bottom: 0; }
.prop > summary, .prop > div { list-style: none; display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; padding: 7px 12px; font-size: var(--t-s); cursor: default; }
.prop > summary { cursor: pointer; }
.prop > summary::-webkit-details-marker { display: none; }
.prop > summary::before, .prop > div::before { content: ""; width: 0; height: 0; border-left: 5px solid var(--ink-3); border-top: 4px solid transparent; border-bottom: 4px solid transparent; align-self: center; }
.prop > div::before { border-left-color: transparent; }
.prop[open] > summary::before { transform: rotate(90deg); }
.prop .v { color: var(--ink-2); font-variant-numeric: tabular-nums; text-align: right; }
.prop .v.ok { color: var(--done); } .prop .v.warn { color: var(--queued); } .prop .v.bad { color: var(--err); }
.prop-more { padding: 0 12px 10px 34px; display: grid; gap: 4px; font-size: var(--t-xs); color: var(--ink-2); }
.prop-more code { font-size: 0.7rem; color: var(--ink-3); overflow-wrap: anywhere; }
.compat { padding: 10px 12px 12px; display: grid; gap: 10px; }
.mini { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 2px; }
.mini div { display: grid; gap: 4px; justify-items: center; }
.mini i { height: 14px; width: 100%; display: block; border-radius: 1px; background: #1c1c1c; }
.mini i.works { background: var(--lc); }
.mini i.untested { background: repeating-conic-gradient(color-mix(in srgb, var(--lc) 62%, #2a2a2a) 0 25%, color-mix(in srgb, var(--lc) 26%, #2a2a2a) 0 50%) 0 0 / 6px 6px; }
.mini i.broken { background: repeating-linear-gradient(135deg, var(--err-fill) 0 3px, #4d1717 3px 6px); }
.mini span { font: 400 0.625rem/1 var(--f-mono); color: var(--ink-3); }
.mini div.sel span { color: var(--cti-ink); }
.mini div.sel i { outline: 1px solid var(--cti); outline-offset: 1px; }
.vote-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.vote-row .btn { padding: 6px 11px; font-size: var(--t-s); }
dl.facts { margin: 0; padding: 10px 12px 12px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; font-size: var(--t-s); }
dl.facts dt { color: var(--ink-3); }
dl.facts dd { margin: 0; overflow-wrap: anywhere; }

              "<dt>" + esc(s.slate.date) + "</dt><dd>" + esc(fmtDate(it.added)) + "</dd>" +
              "<dt>" + esc(s.facts.entry) + '</dt><dd><a href="' + esc(INDEX.repo) + "/blob/main/" + encodeURI(it.entry) + '" target="_blank" rel="noopener">' + esc(it.entry) + "</a></dd>" +
              "<dt>" + esc(s.facts.size) + "</dt><dd>" + fmtSize(it.size) + (it.lines ? ", " + it.lines + " " + esc(s.facts.lines) : "") + "</dd>" +
              "<dt>" + esc(s.facts.sha) + '</dt><dd class="hash">' + esc(it.sha256) + "</dd>" +
            "</dl></section>" +
          "</aside>" +
        "</div>" +
      "</div>";

    app.querySelector(".seg").addEventListener("click", function (e) {
      var b = e.target.closest("[data-tab]");
      if (!b) return;
      state.installTab = b.getAttribute("data-tab");
      var y = window.scrollY;
      renderScript(app, id);
      window.scrollTo(0, y);
    });
    var details = app.querySelector("details.src");
    if (details) details.addEventListener("toggle", function () {
      var box = document.getElementById("code");
      if (details.open && !box.firstChild) box.innerHTML = sourceView(it);
    });
    // The clapper closes when you take the script.
    Array.prototype.forEach.call(app.querySelectorAll("[data-clap]"), function (b) {
      b.addEventListener("click", function () {
        var slate = document.getElementById("slate");
        slate.classList.add("clap");
        setTimeout(function () { slate.classList.remove("clap"); }, 240);
      });
    });
    var copy = document.getElementById("copy");
    if (copy) copy.addEventListener("click", function () {
      var fail = function () {
        if (details) { details.open = true; var box = document.getElementById("code"); if (!box.firstChild) box.innerHTML = sourceView(it); }
        toast(s.copyFail);
      };
      try { navigator.clipboard.writeText(SOURCES[id]).then(function () { toast(s.copied); }, fail); } catch (e) { fail(); }
    });
    wireVotes(app, it);
  }

  function wireVotes(app, it) {
    var s = t();
    var sel = document.getElementById("ver");
    if (sel) sel.addEventListener("change", function () { setVer(+sel.value); });
    var rowEl = app.querySelector(".vote-row");
    if (!rowEl) return;
    rowEl.addEventListener("click", function (e) {
      var b = e.target.closest("[data-vote]");
      if (!b || b.disabled) return;
      var major = VERSIONS[state.ver].major;
      var votes = state.votes[it.id] || {};
      var isNew = !votes[major];
      votes[major] = b.getAttribute("data-vote");
      state.votes[it.id] = votes;
      save("votes2", state.votes);
      renderChrome("script");
      renderScript(app, it.id, true);
      toast(isNew ? s.voted : s.revoted);
    });
  }

  // ---------------------------------------------------------- requests
  function renderRequests(app) {
    var s = t();
    var mine = state.requests.map(function (r) { return { id: r.id, title: r.title, text: r.text, plus: 0, status: "open", mine: true }; });
    var all = mine.slice().reverse().concat(s.examples);
    app.innerHTML =
      '<div class="wrap page">' +
        "<header><h1>" + esc(s.reqTitle) + "</h1><p>" + esc(s.reqLead) + "</p></header>" +
        '<div class="cols">' +
          '<div class="queue" id="queue">' +
            '<div class="q-head"><span>' + esc(s.qHead.num) + "</span><span>" + esc(s.qHead.req) + "</span><span>" + esc(s.qHead.status) + "</span><span>" + esc(s.qHead.votes) + "</span><span></span></div>" +
            all.map(function (r, i) {
              var st = state.takes[r.id] ? "taken" : r.status;
              var cls = st === "done" ? "ok" : st === "taken" ? "review" : "needs";
              var plus = r.plus + (state.plus[r.id] ? 1 : 0);
              return '<div class="q-row">' +
                '<span class="idx">' + (i + 1) + "</span>" +
                '<span class="rqt"><b>' + esc(r.title) + "</b>" + (r.text ? "<span>" + esc(r.text) + "</span>" : "") + '<small class="tag">' + esc(r.mine ? s.yours : s.example) + "</small></span>" +
                '<span class="rq ' + cls + '">' + esc(s.qStatus[st]) + "</span>" +
                '<span class="votes">' + plus + "</span>" +
                '<span class="acts"><button type="button" class="mini-btn" data-plus="' + esc(r.id) + '" aria-pressed="' + !!state.plus[r.id] + '">' + esc(s.plusOne) + '</button> <button type="button" class="mini-btn" data-take="' + esc(r.id) + '" aria-pressed="' + !!state.takes[r.id] + '">' + esc(state.takes[r.id] ? s.taken : s.take) + "</button></span>" +
              "</div>";
            }).join("") +
          "</div>" +
          '<form class="add" id="req-form" novalidate>' +
            '<h2 class="h">' + esc(s.reqForm) + "</h2>" +
            '<label for="req-title">' + esc(s.reqName) + '<input type="text" id="req-title" maxlength="140" placeholder="' + esc(s.reqNamePh) + '"></label>' +
            '<label for="req-text">' + esc(s.reqDesc) + '<textarea id="req-text" maxlength="800" placeholder="' + esc(s.reqDescPh) + '"></textarea></label>' +
            '<label for="req-host">' + esc(s.reqHost) + '<select id="req-host"><option>After Effects</option><option disabled>Blender (' + esc(s.soon) + ")</option><option disabled>Houdini (" + esc(s.soon) + ")</option><option disabled>Nuke (" + esc(s.soon) + ")</option></select></label>" +
            '<button type="submit" class="btn primary">' + esc(s.reqSubmit) + "</button>" +
            '<p class="fine">' + esc(s.localOnly) + "</p>" +
          "</form>" +
        "</div>" +
      "</div>";
    document.getElementById("queue").addEventListener("click", function (e) {
      var p = e.target.closest("[data-plus]"), tk = e.target.closest("[data-take]");
      if (p) { var a = p.getAttribute("data-plus"); state.plus[a] = !state.plus[a]; save("plus", state.plus); }
      else if (tk) { var b = tk.getAttribute("data-take"); state.takes[b] = !state.takes[b]; save("takes", state.takes); }
      else return;
      renderRequests(app);
    });
    document.getElementById("req-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var title = document.getElementById("req-title").value.trim();
      var text = document.getElementById("req-text").value.trim();
      if (!title) { toast(s.reqEmptyName); document.getElementById("req-title").focus(); return; }
      state.requests.push({ id: "my" + Date.now(), title: title, text: text });
      save("requests", state.requests);
      renderRequests(app);
      toast(s.reqAdded);
    });
  }

  // ------------------------------------------------------------ submit
  var SAMPLE = {
    id: "layer-grid", version: "1.0.0", entry: "scripts/layer-grid.jsx", host: "aftereffects", kind: "script", category: "layers",
    title: { en: "Layers to grid", ru: "Слои по сетке" },
    summary: { en: "Lays selected layers out on a grid with spacing.", ru: "Раскладывает выделенные слои по сетке с отступом." },
    description: { en: "…", ru: "…" },
    usage: { en: "Select layers and run the script.", ru: "Выделите слои и запустите скрипт." },
    tags: ["layout", "grid", "position"],
    hostVersions: { min: "2019 (16.0)", tested: ["AE 2025"] },
    author: { name: "Your Name", github: "your-login" },
    license: "MIT",
    ai: { level: "assisted", model: "Claude", humanReviewed: true },
    permissions: [], requires: [], notes: { en: "", ru: "" }
  };
  function renderSubmit(app) {
    var s = t();
    app.innerHTML =
      '<div class="wrap page">' +
        "<header><h1>" + esc(s.submitTitle) + "</h1><p>" + esc(s.submitLead) + "</p></header>" +
        '<div class="cols even">' +
          '<div class="prose">' +
            '<ol class="steps">' + s.submitSteps.map(function (x) { return "<li>" + x + "</li>"; }).join("") + "</ol>" +
            '<section class="card"><h2 class="h">' + esc(s.autoTitle) + '</h2><ul class="plain">' + s.autoList.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul></section>" +
            '<section class="card"><h2 class="h">' + esc(s.aiTitle) + "</h2><p>" + esc(s.aiText) + "</p></section>" +
            '<p class="note">' + esc(s.noPoints) + ' <a href="#keepers">' + esc(s.nav.keepers) + "</a></p>" +
          "</div>" +
          '<section class="prose"><h2 class="h">' + esc(s.manifestTitle) + ': <code class="path">catalog/layer-grid.json</code></h2><pre class="manifest">' + esc(JSON.stringify(SAMPLE, null, 2)) + "</pre></section>" +
        "</div>" +
      "</div>";
  }

  // ----------------------------------------------------------- keepers
  function renderKeepers(app) {
    var s = t(), xp = xpTotal(), r = rankFor(xp), ranks = s.ranks, next = ranks[r + 1];
    var pct = next ? Math.round(((xp - ranks[r][1]) / (next[1] - ranks[r][1])) * 100) : 100;
    app.innerHTML =
      '<div class="wrap page">' +
        "<header><h1>" + esc(s.keepersTitle) + "</h1><p>" + esc(s.keepersLead) + "</p></header>" +
        '<div class="progress">' +
          '<div class="top"><span>' + esc(s.yourXp) + ": <b>" + xp + " XP</b>, " + esc(ranks[r][0]) + "</span><span>" + esc(next ? s.toNext(next[1] - xp, next[0]) : s.top) + "</span></div>" +
          '<div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><i style="width:' + pct + '%"></i></div>' +
          '<p class="fine">' + esc(s.localOnly) + "</p>" +
        "</div>" +
        '<div class="ladder">' + ranks.map(function (x, i) {
          return '<div class="rung' + (i === r ? " now" : "") + '"><b>' + esc(x[0]) + "</b><span>" + x[1] + "+ XP</span></div>";
        }).join("") + "</div>" +
        '<div class="cols">' +
          '<section class="prose"><h2 class="h">' + esc(s.rulesTitle) + '</h2><div style="overflow-x:auto"><table class="rules"><thead><tr><th>' + esc(s.rulesHead[0]) + '</th><th style="text-align:right">' + esc(s.rulesHead[1]) + "</th></tr></thead><tbody>" +
            s.rules.map(function (x) {
              return '<tr class="' + (x[1] === 0 ? "zero" : "") + '"><td>' + esc(x[0]) + (x[2] ? '<span class="live">' + esc(s.live) + "</span>" : "") + '</td><td class="num">' + (x[1] ? "+" + x[1] : "0") + "</td></tr>";
            }).join("") +
          '</tbody></table></div><p class="note">' + esc(s.zero) + "</p></section>" +
          '<section class="card"><h2 class="h">' + esc(s.marksTitle) + '</h2><dl class="defs">' + s.marks.map(function (b) { return "<dt>" + esc(b[0]) + "</dt><dd>" + esc(b[1]) + "</dd>"; }).join("") + "</dl></section>" +
        "</div>" +
      "</div>";
  }

  // ------------------------------------------------------------- about
  function renderAbout(app) {
    var s = t();
    var hosts = [
      { name: "After Effects", versions: VERSIONS.map(function (v) { return String(v.major); }), open: true },
      { name: "Blender", versions: ["3.6", "4.0", "4.1", "4.2", "4.3", "4.4", "4.5", "5.0", "5.1"] },
      { name: "Houdini", versions: ["19.0", "19.5", "20.0", "20.5", "21.0"] },
      { name: "Nuke", versions: ["13", "14", "15", "16", "17"] },
      { name: "DaVinci Resolve", versions: ["17", "18", "19", "20", "21"] }
    ];
    app.innerHTML =
      '<div class="wrap page">' +
        "<header><h1>" + esc(s.aboutTitle) + "</h1><p>" + esc(s.aboutLead) + "</p></header>" +
        '<div class="cols even">' +
          '<div class="prose">' + s.aboutText.map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("") +
            '<section class="card"><h2 class="h">' + esc(s.rulesHouse) + '</h2><ul class="plain">' + s.house.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul></section>" +
          "</div>" +
          '<section class="card"><h2 class="h">' + esc(s.hostsTitle) + '</h2><p class="fine">' + esc(s.hostsLead) + '</p><div class="hosts">' +
            hosts.map(function (h, k) {
              return '<div class="host-row' + (h.open ? "" : " soon") + '"><span>' + esc(h.name) + (h.open ? "" : " (" + esc(s.soon) + ")") + '</span><div class="mini" style="--n:' + h.versions.length + ";--lc:" + ["var(--l-blue)", "var(--l-orange)", "var(--l-red)", "var(--l-yellow)", "var(--l-cyan)"][k] + '">' +
                h.versions.map(function (v) { return '<div><i class="' + (h.open ? "works" : "untested") + '"></i><span>' + esc(v) + "</span></div>"; }).join("") + "</div></div>";
            }).join("") +
          "</div></section>" +
        "</div>" +
      "</div>";
  }

  // ------------------------------------------------------------ router
  var lastView = null;
  function render() {
    var r = route(), app = document.getElementById("app");
    renderChrome(r.view);
    if (r.view === "script") renderScript(app, r.id);
    else if (r.view === "requests") renderRequests(app);
    else if (r.view === "submit") renderSubmit(app);
    else if (r.view === "keepers") renderKeepers(app);
    else if (r.view === "about") renderAbout(app);
    else renderCatalog(app, false);
    var key = r.view + (r.id || "");
    if (key !== lastView) { window.scrollTo(0, 0); lastView = key; }
    document.title = r.view === "script" ? L(BY_ID[r.id].title) + " · VFX Cave" : "VFX Cave";
  }

  document.querySelector(".lang").addEventListener("click", function (e) {
    var b = e.target.closest("[data-lang]");
    if (!b) return;
    state.lang = b.getAttribute("data-lang");
    save("lang", state.lang);
    var y = window.scrollY;
    lastView = route().view + (route().id || "");
    render();
    window.scrollTo(0, y);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "/" || /^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName || ""))) return;
    var q = document.getElementById("q");
    if (q) { e.preventDefault(); q.focus(); }
  });
  window.addEventListener("hashchange", render);
  render();
})();
</script>
